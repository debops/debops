name: Super-Linter
on: [ 'workflow_dispatch' ]

permissions:
  contents: read
  statuses: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  "Super-Linter":
    runs-on: 'ubuntu-latest'
    steps:

      - name: Clone the repository
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0

      - name: Lint codebase
        uses: 'super-linter/super-linter@v9.0.0'
        env:
          DEFAULT_BRANCH: 'master'
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'

          # Check the entire codebase by default. This workflow is executed
          # manually for now, until all issues in the codebase found by the
          # Super-Linter are fixed.
          VALIDATE_ALL_CODEBASE: True

          # Most of the scripts in the repository are meant to be installed by
          # Ansible and executed on the remote hosts and don't need an
          # executable bit in the repository itself.
          VALIDATE_BASH_EXEC: False

          # Super-Linter accepts either an include list or an exclude
          # list of lint families, never both. This workflow uses the
          # exclude form: the default set minus the families disabled
          # below. What remains is what this repository actively
          # maintains, the same families the Continuous Integration
          # workflow enforces: Ansible (with the repository's own
          # ansible-lint configuration), shell scripts, YAML, the
          # GitHub Actions definitions, the Dockerfile lint, secrets,
          # spelling and merge conflict markers.
          ANSIBLE_CONFIG_FILE: '.ansible-lint'
          SAVE_SUPER_LINTER_SUMMARY: True

          # The remaining linter families are disabled: they flag third-party
          # application code bundled in the role 'files/' and 'templates/'
          # directories, or style families this repository deliberately does
          # not follow (Python formatters, Prettier, shfmt).
          VALIDATE_BIOME_FORMAT: False
          VALIDATE_BIOME_LINT: False
          VALIDATE_CHECKOV: False
          VALIDATE_CSS: False
          VALIDATE_CSS_PRETTIER: False
          VALIDATE_HTML: False
          VALIDATE_HTML_PRETTIER: False
          VALIDATE_JSCPD: False
          VALIDATE_JSON_PRETTIER: False
          VALIDATE_MARKDOWN: False
          VALIDATE_MARKDOWN_PRETTIER: False
          VALIDATE_NATURAL_LANGUAGE: False
          VALIDATE_PERL: False
          VALIDATE_PHP_BUILTIN: False
          VALIDATE_PHP_PHPCS: False
          VALIDATE_PHP_PHPSTAN: False
          VALIDATE_PHP_PSALM: False
          VALIDATE_PYTHON_BLACK: False
          VALIDATE_PYTHON_FLAKE8: False
          VALIDATE_PYTHON_ISORT: False
          VALIDATE_PYTHON_MYPY: False
          VALIDATE_PYTHON_PYLINT: False
          VALIDATE_PYTHON_RUFF: False
          VALIDATE_PYTHON_RUFF_FORMAT: False
          VALIDATE_RUBY: False
          VALIDATE_SHELL_SHFMT: False
          VALIDATE_TRIVY: False
          VALIDATE_YAML_PRETTIER: False

          # Some of the files are incorrectly detected or use Jinja syntax for
          # templating; they should be ignored by the linters
          FILTER_REGEX_EXCLUDE: '(/ansible/roles/grub/templates/etc/grub.d/01_users.j2|/ansible/roles/slapd/templates/etc/ldap/slapacl-test-suite.j2|/ansible/roles/dropbear_initramfs/templates/etc/initramfs-tools/scripts/local-bottom/debops_dropbear_initramfs.j2|/ansible/roles/gitusers/files/var/lib/gitusers/functions.sh)'
