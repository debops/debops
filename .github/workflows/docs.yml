name: Documentation
on:
  push:
    branches:
      - 'master'
      - 'stable-3.*'
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: '${{ github.workflow }}-${{ github.ref }}'
  cancel-in-progress: true

jobs:
  build-and-upload:
    runs-on: 'ubuntu-latest'
    # Pull requests from forks don't have access to repository secrets;
    # skip the job instead of failing on the upload step.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 30
    steps:

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Set up the pinned Sphinx toolchain
        uses: 'actions/setup-python@v7'
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'docs/requirements.txt'

      - name: Install documentation dependencies
        run: 'pip install -r docs/requirements.txt'

      - name: Build HTML documentation
        # Mirrors the command Read the Docs runs for the HTML build; the
        # '-j auto' flag and the serial write hook are documented in
        # '.readthedocs.yml' and 'docs/requirements.txt'.
        run: >-
          python -m sphinx -j auto -T -b html
          -d _build/doctrees -D language=en
          docs/ _build/html

      - name: Upload documentation to Read the Docs
        uses: 'readthedocs/upload-action@v1'
        with:
          token: '${{ secrets.READTHEDOCS_TOKEN }}'
          html: '_build/html'

      - name: Upload documentation to Read the Docs (latest alias)
        if: github.ref == 'refs/heads/master'
        uses: 'readthedocs/upload-action@v1'
        with:
          token: '${{ secrets.READTHEDOCS_TOKEN }}'
          html: '_build/html'
          version-name: 'latest'
