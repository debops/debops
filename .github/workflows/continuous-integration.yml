name: Continuous Integration
on: [ 'push', 'pull_request' ]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  reuse-spdx:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Prepare test environment
        run: |
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools reuse
          pip3 check

      - name: Check codebase with REUSE linter
        run: |
          reuse --version
          make test-spdx
          make check

  ansible-lint:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Prepare test environment
        run: |
          sudo apt-get remove --purge -yq ansible
          sudo apt-get install python3-netaddr
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools Jinja2 ansible ansible-lint
          pip3 check

      - name: Verify playbook with ansible-lint
        run: |
          ansible-lint --version
          make test-ansible-lint
          make check

  ansible-playbook:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Prepare test environment
        run: |
          sudo apt-get remove --purge -yq ansible
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools Jinja2 ansible
          pip3 check

      - name: Check playbook syntax with ansible-playbook
        run: |
          ansible --version
          make test-playbook-syntax
          make check

  ansible-galaxy:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0

      - name: Prepare test environment
        run: |
          sudo apt-get -qq update
          sudo apt-get -yq install pandoc pandoc-data
          sudo apt-get remove --purge -yq ansible
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools Jinja2 ansible ansible-lint yamllint \
            galaxy-importer reuse
          pip3 check

      - name: Build DebOps Collections for Ansible Galaxy
        env:
          DEBOPS_VERSION: '0.0.0'
        run: |
          yamllint --version
          ansible --version
          ansible-lint --version
          make collection
          make test-smoke-collection
          make check

  yamllint:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Prepare test environment
        run: |
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools yamllint
          pip3 check

      - name: Check codebase with yamllint
        run: |
          yamllint --version
          make test-yaml
          make check

  pycodestyle:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Prepare test environment
        run: |
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools pycodestyle==2.15.0
          pip3 check

      - name: Check codebase with pycodestyle
        run: |
          printf "pycodestyle %s\\n" "$(pycodestyle --version)"
          make test-pep8
          make check

  shellcheck:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Prepare test environment
        # shellcheck v0.9.0 has bugs triggered by DebOps, so we install newer
        # version from upstream to avoid that
        #run: |
        #  sudo apt-get -qq update
        #  sudo apt-get install -yq shellcheck
        run: |
          ./lib/tests/ci-install-shellcheck

      - name: Check shell scripts with shellcheck
        run: |
          shellcheck --version
          make test-shell
          make check

  actionlint:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Prepare test environment
        run: './lib/tests/ci-install-actionlint'

      - name: Check workflow files with actionlint
        run: |
          actionlint --version
          make test-actionlint
          make check

  docker-image:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Build and verify Docker image
        # https://github.com/actions/runner/issues/241
        shell: 'script -q -e -c "bash {0}"'
        env:
          WITH_MANPAGES: '0'
        run: 'make test-docker-build'

  debops-python-matrix:
    runs-on: 'ubuntu-latest'
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12', '3.13']
        experimental: [false]
        include:
          - python-version: '3.14'
            experimental: true
          - python-version: '3.15'
            experimental: true
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0

      - name: Set up the matrix Python
        uses: 'actions/setup-python@v7'
        with:
          python-version: '${{ matrix.python-version }}'
          cache: 'pip'
          cache-dependency-path: 'requirements-ci.txt'

      - name: Prepare test environment
        run: |
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools pytest pytest-cov future pyyaml python-dotenv \
            toml pyxdg jinja2 distro GitPython
          pip3 check

      - name: Run DebOps unit tests
        run: |
          make clean-tests
          make test-unit

  debops-test-coverage:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 30
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0

      - name: Prepare test environment
        run: |
          sudo apt-get -qq update
          sudo apt-get -yq install git gnupg git-crypt
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools pytest pytest-cov ansible-core \
            future pyyaml python-dotenv toml pyxdg jinja2 distro GitPython
          pip3 check

      - name: Run unit and integration tests
        run: |
          make clean-tests
          make test-coverage
          make test-debops-ansible_plugins
          make check

  debops-wheel:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 120
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0

      - name: Prepare test environment
        run: |
          sudo apt-get -qq update
          sudo apt-get -yq install pandoc pandoc-data graphviz
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools sphinx sphinx-autobuild \
            sphinx-rtd-theme pypandoc
          pip3 check

      - name: Build DebOps Python wheel package
        run: |
          make clean-tests
          make check
          make test-man wheel-quiet
          make test-metadata
          make test-smoke

  debops-sdist:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 120
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0

      - name: Prepare test environment
        run: |
          sudo apt-get -qq update
          sudo apt-get -yq install pandoc pandoc-data graphviz
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools sphinx sphinx-autobuild \
            sphinx-rtd-theme pypandoc
          pip3 check

      - name: Build DebOps Python sdist package
        run: |
          make clean-tests
          make check
          make test-man sdist-quiet
          make test-metadata
          make test-smoke

  codespell:
    runs-on: 'ubuntu-latest'
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'
        with:
          fetch-depth: 0

      - name: Prepare test environment
        run: |
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools codespell tomli
          pip3 check

      - name: Check common misspellings using codespell
        run: |
          make clean-tests
          make test-spell

  documentation:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 120
    steps:

      - name: Add ~/.local/bin to $PATH
        run: 'printf "%s/.local/bin\n" "${HOME}" >> "${GITHUB_PATH}"'

      - name: Clone the repository
        uses: 'actions/checkout@v7'

      - name: Prepare test environment
        run: |
          sudo apt-get -qq update
          sudo apt-get install -yq graphviz
          pip3 install --user -c requirements-ci.txt \
            pip wheel setuptools sphinx sphinx-autobuild sphinx-rtd-theme
          pip3 check

      - name: Build documentation site
        run: |
          sphinx-build --version
          dot -V
          make test-docs
          make check
