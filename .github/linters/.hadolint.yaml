# hadolint configuration, mirroring the ignores the repository's own
# Docker build test sets:
#
#     lib/tests/check-docker-build: hadolint --ignore DL3008 --ignore DL3013
#
# DL3008 keeps Debian packages unpinned in the image; DL3013 keeps the
# pip installs tied to the package repositories that carry them.
ignored:
  - DL3008
  - DL3013
