# This file contains the default DebOps configuration options. It will be
# parsed by Jinja template engine before being passed over to the Python's
# TOML parser. The 'env' dictionary contains the environment variables.

[binaries]

# Path to binary which will be used to execute 'ansible' command.
# By default it will rely on the system's $PATH.
ansible = "{{ env['DEBOPS_CMD_ANSIBLE'] | d('ansible') }}"

# Path to binary which will be used to execute 'ansible-inventory' command.
# By default it will rely on the system's $PATH.
ansible-inventory = "{{ env['DEBOPS_CMD_ANSIBLE_INVENTORY'] | d('ansible-inventory') }}"

# Path to binary which will be used to execute 'ansible-galaxy' command.
# By default it will rely on the system's $PATH.
ansible-galaxy = "{{ env['DEBOPS_CMD_ANSIBLE_GALAXY'] | d('ansible-galaxy') }}"

# Path to binary which will be used to execute 'ansible-playbook' command.
# By default it will rely on the system's $PATH.
ansible-playbook = "{{ env['DEBOPS_CMD_ANSIBLE_PLAYBOOK'] | d('ansible-playbook') }}"

# Path to binary which will be used to call the 'gpg(1)' commands to encrypt or
# decrypt files. By default it will rely on the system's $PATH.
gpg = "{{ env['DEBOPS_CMD_GPG'] | d('gpg') }}"

# Path to binary which will be used to manage the secret directories encrypted
# using 'encfs(1)' tool. By default it will rely on the system's $PATH.
encfs = "{{ env['DEBOPS_CMD_ENCFS'] | d('encfs') }}"

# Path to binary which will be used to call the 'git(1)' commands to manage git
# repositories. By default it will rely on the system's $PATH.
git = "{{ env['DEBOPS_CMD_GIT'] | d('git') }}"

# Path to binary which will be used to manage the secret directories encrypted
# using 'git-crypt(1)' tool. By default it will rely on the system's $PATH.
git-crypt = "{{ env['DEBOPS_CMD_GITCRYPT'] | d('git-crypt') }}"

# Path to binary which will be used to unmount the mounted 'encfs(1)' volume on
# Darwin hosts (macOS). By default it will rely on the system's $PATH.
umount = "{{ env['DEBOPS_CMD_UMOUNT'] | d('umount') }}"

# Path to binary which will be used to unmount the mounted 'encfs(1)' volume on
# hosts with FUSE support. By default it will rely on the system's $PATH.
fusermount = "{{ env['DEBOPS_CMD_FUSERMOUNT'] | d('fusermount') }}"

# Path to binary which will be used to connect to the hosts over the
# 'ssh(1)' protocol. By default it will rely on the system's $PATH.
ssh = "{{ env['DEBOPS_CMD_SSH'] | d('ssh') }}"

# Path to binary which will be used to remove the known_hosts entries of the
# hosts. By default it will rely on the system's $PATH.
ssh-keygen = "{{ env['DEBOPS_CMD_SSH_KEYGEN'] | d('ssh-keygen') }}"

# Path to binary which will be used to scan the SSH host keys of the hosts.
# By default it will rely on the system's $PATH.
ssh-keyscan = "{{ env['DEBOPS_CMD_SSH_KEYSCAN'] | d('ssh-keyscan') }}"

# Path to binary which will be used to copy files to and from the hosts over
# the 'ssh(1)' protocol. By default it will rely on the system's $PATH.
scp = "{{ env['DEBOPS_CMD_SCP'] | d('scp') }}"

# Path to binary which will be used to run the interactive file transfer
# sessions over the 'ssh(1)' protocol. By default it will rely on the
# system's $PATH.
sftp = "{{ env['DEBOPS_CMD_SFTP'] | d('sftp') }}"

# Path to binary which will be used to execute 'tofu' (OpenTofu) commands.
# By default it will rely on the system's $PATH. At runtime the option
# points at the managed binary of the version which the used view pins,
# when it is installed; the configured value is the fallback which the
# hand-made views run, unmanaged.
tofu = "{{ env['DEBOPS_CMD_TOFU'] | d('tofu') }}"

[gpg.debops.keyring]

# The GnuPG homedir of the DebOps-managed keyring, separate from the
# user's own GnuPG home. The keyring holds the public keys of the
# parties which sign the artifacts DebOps downloads and verifies: the
# trust anchor is the fingerprint of the expected signing key,
# recorded in the configuration of the party which uses it.
#
# An empty path resolves to the 'debops/gnupg' directory of the XDG
# data location, shared across projects.
path = ""

# The options of the keyring's 'gpg.conf' file, rendered literally:
# a string value renders as 'name value', a list as 'name v1 v2' --
# the multi-value syntax of gpg.conf -- a boolean 'true' emits the
# option name alone, and 'false' omits the line, letting the
# option's gpg default apply.
[gpg.debops.keyring.gpg_conf]
keyserver = "hkps://keyserver.ubuntu.com"
fixed-list-mode = true
no-greeting = true
no-emit-version = true
no-comments = true

[tofu]

# Path to the state file of the local backend, relative to the view's
# 'tofu' directory. The backend block of the view's OpenTofu
# configuration should point at the same path: the 'debops tofu' wrapper
# uses it for the state lock pre-check and to detect the missing-state
# condition before state-touching operations. Set it to an empty string
# in views which use a remote backend; the wrapper then skips the local
# state checks.
state_path = "secret/terraform.tfstate"

# The OpenTofu operations which the 'debops tofu' wrapper is allowed to
# run. An empty list allows every operation; a non-empty list restricts
# the wrapper to the named operations, for example:
#
#     operations = ["plan", "apply", "destroy", "output"]
#
# The raw 'tofu' command is not affected by this option.
operations = []

# The OpenTofu providers which the tofu views of the project use. The
# list is written into the generated 'providers.tf' file of a view when
# it is created; the '--provider' options of the 'debops tofu init'
# command replace it for one invocation. Each entry is a provider
# source address in the OpenTofu registry notation -- 'namespace/name',
# or 'hostname/namespace/name' for providers outside the public
# registry -- optionally with a version pin separated by '=':
#
#     default_providers = ["lxc/incus=1.2.1", "hashicorp/tfcoremock"]
#
# An empty list creates providerless views. The option is consulted
# only when a view is created: the provider set of an existing view is
# changed by editing the view's configuration drop-in, which the
# 'debops tofu update' command reconciles into the generated files.
default_providers = []

# The OpenTofu modules which the tofu views of the project
# instantiate. The table is written into the generated 'modules.tf'
# file of a view when it is created; the '--module' options of the
# 'debops tofu init' command replace it for one invocation. The table
# keys are the local module names which the generated file
# instantiates; each entry carries the module source address in the
# OpenTofu registry notation -- 'namespace/name[/submodule]', or
# 'hostname/...' for modules outside the public registry -- an
# optional version pin and the inputs of the module instance:
#
#     [tofu.default_modules.consul]
#     source = "hashicorp/consul/aws"
#     version = "5.0.0"
#
#     [tofu.default_modules.consul.inputs]
#     datacenter = "dc1"
#
# The input values are configuration values: the literals render as
# the HCL literals of the generated file, and strings which carry the
# 'hcl:' prefix carry raw HCL expressions which the file emits
# verbatim -- 'image = "hcl:var.image_name"' instantiates the module
# with 'image = var.image_name'. An empty table creates views without
# modules. The option is consulted only when a view is created: the
# module set of an existing view is changed by editing the view's
# configuration drop-in, which the 'debops tofu update' command
# reconciles into the generated files.
default_modules = {}

# How many plan files the DebOps flows keep in the state directory. The
# plan files which DebOps itself saves are pruned to the newest ones;
# plan files which the user saves with the '-out' option are never
# touched.
plan_retention = 3

[tofu.upstream]

# The OpenTofu version which the debops package is verified with: the
# known-good version which the 'binary_version' option of a new view's
# configuration drop-in is seeded with at creation. Bumping the option
# in a debops release changes the seed of the new views; the views
# which exist keep their recorded version -- the drop-in is written
# once, the pin is the user's record from then on.
known_version = "1.13.9"

# The base of the OpenTofu release downloads: the GitHub releases of
# the opentofu/opentofu repository. The '{version}' placeholder is
# substituted with the version of the release to install; the option
# points the 'debops tofu install' command at a mirror of the
# releases when the GitHub downloads are not reachable.
release_base = "https://github.com/opentofu/opentofu/releases/download/v{version}"

[tofu.upstream.release_key]

# The fingerprint of the GnuPG key which signs the OpenTofu releases.
# The 'debops tofu install' command verifies the signature of the
# release checksums against the DebOps-managed keyring, and the
# signing key's fingerprint must match this pin: the fingerprint is
# the trust anchor, not the key material. The key is imported from
# the keyserver of the DebOps keyring when it is missing.
fingerprint = "E3E6E43D84CB852EADB0051D0C0AF313E5FD9F80"

[git]

# The default commit message used for new git repositories.
init_message = "Initialize new DebOps project directory"

[ssh.rescan]

# What to do when the scanned keys of a host match the SSHFP records
# of the DNS, but the DNS answer was not authenticated by DNSSEC.
# RFC 4255 forbids trusting unauthenticated SSHFP records; with
# 'true', such a match grants no trust and the keys are handled like
# the keys of hosts without SSHFP records: stored as scanned, or
# confirmed by the operator with the '--confirm' option. With
# 'false', such hosts are not stored at all; run the rescan with
# '--confirm' to accept the keys after checking the fingerprints.
trust_unsigned_records = true

# The DNS verification mode the rescan runs with when the '--dns',
# '--no-dns' and '--dns-verify' options do not name one. The modes
# are the ones of the options: 'dns' verifies the scanned keys
# against the SSHFP records of the DNS, 'no-dns' skips the DNS check
# and 'dns-verify' requires a DNSSEC-validating resolver to
# authenticate the records before a match is trusted.
resolver_mode = 'dns'

# Ask for the scanned fingerprints before every store of a rescan,
# the way the '--confirm' option does. The '--no-confirm' option
# turns the prompting off for one invocation.
confirm = false

[project.venv]

# Enable an encapsulated Python virtual environment in the project directory,
# managed by the 'debops project venv' command. Usually enabled at project
# creation time with the 'debops project init --venv' command.
enabled = false

# Path to the Python virtual environment, relative to the project directory.
path = ".debops/venv"

# Path to the file with pinned Python package versions, relative to the
# project directory.
requirements = ".debops/requirements.txt"

# Python interpreter used to create the virtual environment.
python = "python3"

[syslog]

# Hostname or IP address of a syslog server where messages should be sent.
# If address starts with a slash (/), it's assumed to be an UNIX socket.
address = "/dev/log"

# UDP port of a remote syslog server where messages will be sent.
port = 514

# Syslog facility to use when sending messages. Supported facilities:
# kern, user, mail, daemon, auth, syslog, lpr, news, uucp, authpriv, ftp,
# cron, local0, local1, local2, local3, local4, local5, local6, local7
facility = "user"

# Syslog level to use for syslog messages; the terminal output stays at
# WARNING unless '-v' raises it, one step less verbose than the journal.
# Supported levels are:
# DEBUG, INFO, NOTICE, WARNING, ERROR, CRITICAL
level = "NOTICE"

[version_check]

# Enable checking for new DebOps versions at startup. When enabled,
# DebOps periodically checks a configured source and displays a notice
# on stderr if an update is available. This option is opt-in only.
enabled = false

# How often to check for updates, in hours. The result is cached locally,
# so network calls only happen once per interval.
check_interval = 24

# Timeout in seconds for network requests (PyPI) and git subprocess calls.
timeout = 5

# PyPI package name to query when installed via pip/pipx.
pypi_package = "debops"

# PyPI JSON API URL template. The {package} placeholder is replaced with
# the value of pypi_package.
pypi_url = "https://pypi.org/pypi/{package}/json"

# Name of the git remote to fetch and compare against for git checkouts.
git_remote = "origin"

# Optional URL of the canonical DebOps git repository to check against.
# When set, the check fetches from this URL directly instead of the
# configured git_remote. Use this when the local 'origin' is a fork, or
# for self-hosted mirrors. When empty, the git_remote name is used and
# the user's existing git credentials and configuration are respected.
git_repo_url = ""

[custom]

# This section is reserved for custom configuration options defined
# outside of DebOps. Scripts and integrations can store their parameters
# here, read them with the 'debops config get' command and override them
# from the environment using 'DEBOPS_CONFIG__CUSTOM__...' variables, for
# example:
#
#     [custom.myscript]
#     retries = 5
#
# DebOps does not use this section and will not define options in it.
