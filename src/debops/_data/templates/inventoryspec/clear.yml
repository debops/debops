---
# Inventory specification for a DebOps project. Use with --force

# This document is version 0, the paths and file contents are written
# literally.
version: 0

# File and directory definitions, each YAML dictionary key is a file path.
# Paths are relative to the 'inventory/' directory in DebOps project or view.
files:

  # Remove all variable definitions from group_vars/ along with the directory
  # (any files that are specified in the 'keep' key will preserve it).
  group_vars/: null

  # Remove all variable definitions from host_vars/, and make sure that the
  # directory exists.
  host_vars/: ''

# Paths which this specification must leave alone, wildcards allowed.
keep:

  # File generated by DebOps during initialization
  - 'group_vars/all/keyring.yml'
