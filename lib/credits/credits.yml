# Configuration of the CREDITS file generator. Run 'make credits' in the
# root of the repository to regenerate the CREDITS file using the git
# commit history and the sections defined in this file.

credits:

  # Width around which the contents of the CREDITS file are centered.
  # Lines longer than this are left unindented.
  width: 80

  # Git-derived sections. The contributors are counted in a single list
  # and split between the sections: the 'main_authors' section contains
  # the most active contributors of the whole project, the remaining
  # contributors are assigned to the section whose paths they committed
  # to the most. Each contributor is listed only once, with the number
  # of commits that placed them in their section.
  main_authors:
    title: "Main authors"
    count: 20

  ansible_content:
    title: "Ansible content creators"
    paths:
      - 'ansible/'
      - 'playbooks/'
      - 'tasks/'
      - 'defaults/'
      - 'templates/'
      - 'handlers/'
      - 'meta/'
      - 'vars/'
      - 'files/'
      - 'library/'
      - 'filter_plugins/'
      - 'roles/'
      - 'galaxy/'

  scripts:
    title: "DebOps scripts contributors"
    paths:
      - 'src/'
      - 'lib/'
      - 'bin/'
      - 'debops/'
      - 'tests/'
      - 'setup.py'
      - 'setup.cfg'
      - 'pyproject.toml'
      - 'MANIFEST.in'
      - 'Makefile'
      - 'PKGBUILD'
      - 'Dockerfile'
      - 'Vagrantfile'
      - '.gitlab-ci.yml'
      - '.travis.yml'
      - '.github/'

  documentation:
    title: "Documentation contributors"
    paths:
      - 'docs/'
      - 'doc/'
      - 'README.md'
      - 'README.rst'
      - 'INSTALL.rst'
      - 'CONTRIBUTING.rst'
      - 'DEVELOPMENT.rst'
      - 'UPGRADE.rst'
      - 'CHANGES.rst'
      - 'CHANGELOG.rst'

  contributors:
    title: "Contributors"

  # Skip merge commits in the commit statistics
  exclude_merges: true

  # Year the project started, shown in the header as 'since-<current>'
  since: 2013

  # Additional git refs included in the commit statistics — the private
  # history of the project before it was published on GitHub. Refs that
  # don't exist in the local clone are skipped.
  additional_refs:
    - 'origin/ginas-historical'

