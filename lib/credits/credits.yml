# Software used in the DebOps project, in the reverse stack order
software:
  - name: "Ansible"
    url: "https://docs.ansible.com/"
    description: "Automation framework that DebOps is built on"
  - name: "Jinja2"
    url: "https://jinja.palletsprojects.com/"
    description: "Template engine for the Ansible roles and the DebOps CLI"
  - name: "Sphinx"
    url: "https://www.sphinx-doc.org/"
    description: "Documentation system that DebOps relies on"
  - name: "Python"
    url: "https://www.python.org/"
    description: "Programming language of the DebOps CLI and Ansible"
  - name: "Debian GNU/Linux"
    url: "https://www.debian.org/"
    description: "The universal operating system"
  - name: "Git"
    url: "https://git-scm.com/"
    description: "Distributed version control system"
  - name: "GNU Bash"
    url: "https://www.gnu.org/software/bash/"
    description: "Shell used by the DebOps scripts"
  - name: "GnuPG"
    url: "https://www.gnupg.org/"
    description: "Encryption of the DebOps keyring and secret storage"
  - name: "git-crypt"
    url: "https://www.agwa.name/projects/git-crypt/"
    description: "Transparent encryption of files in the project repository"
  - name: "encfs"
    url: "https://encfs.readthedocs.io/"
    description: "Encrypted directory for the DebOps project secrets"

# Closing quotes, rendered at the end of the file without a header
quotes:
  - text: >-
      In my experience, the basis for having sustainable and maintainable
      systems have been well known and tested in Debian, and several other
      distributions, for over two decades. At FOSDEM, we thought that we
      need a name for such a mindset. Between beers, that name came to be
      "debops".
    author: "Enrico Zini"
    source: "\"Debops\", 2014"
  - text: "Talk is cheap. Show me the code."
    author: "Linus Torvalds"

# Contributions made with assistance of large language models. Entries
# defined here are removed from the git-derived sections and acknowledged
