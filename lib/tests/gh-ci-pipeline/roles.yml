# DebOps CI pipeline role manifest. Each entry describes a single test job
# executed by the 'DebOps CI Pipeline' GitHub Actions workflow. See the
# GitHub Actions CI pipeline documentation in docs/developer-guide/ for the
# entry schema and the role exclusion rules.

- name: 'bootstrap'
  playbook: 'bootstrap'
  always: True
  idempotency: 'advisory'

- name: 'common'
  playbook: 'common'
  always: True
  idempotency: 'advisory'

- name: 'apt'
  playbook: 'service/apt'
  idempotency: 'advisory'

- name: 'apt_listchanges'
  playbook: 'service/apt_listchanges'
  idempotency: 'advisory'

- name: 'vmagent'
  playbook: 'service/vmagent'
  groups: [ 'debops_service_vmagent' ]
  idempotency: 'advisory'
  inventoryspec:
    files:
      group_vars/all/vmagent.yml: |
        ---
        vmagent__remote_write_urls:
          - 'http://127.0.0.1:8428/api/v1/write'
  post_script: |
    vmagent -version
    systemctl is-active vmagent@default.service
    curl -fsS http://127.0.0.1:8429/metrics | grep -q '^vm_app_version'

- name: 'mariadb_server'
  playbook: 'service/mariadb_server'
  groups: [ 'debops_service_mariadb_server' ]
  idempotency: 'advisory'

- name: 'postgresql_server'
  playbook: 'service/postgresql_server'
  groups: [ 'debops_service_postgresql_server' ]
  idempotency: 'advisory'

- name: 'python'
  playbook: 'service/python'
  groups: [ 'debops_service_python' ]
  idempotency: 'advisory'
