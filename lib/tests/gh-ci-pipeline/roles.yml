# DebOps CI pipeline role manifest. Each entry describes a single test job
# executed by the 'DebOps CI Pipeline' GitHub Actions workflow. See the
# GitHub Actions CI pipeline documentation in docs/developer-guide/ for the
# entry schema and the role exclusion rules.

- name: 'bootstrap'
  playbook: 'bootstrap'
  always: True
  idempotency: 'advisory'

- name: 'common'
  playbook: 'common'
  always: True
  idempotency: 'advisory'

- name: 'apt'
  playbook: 'service/apt'
  idempotency: 'advisory'

- name: 'apt_listchanges'
  playbook: 'service/apt_listchanges'
  idempotency: 'advisory'

- name: 'garage'
  playbook: 'service/garage'
  groups: [ 'debops_service_garage' ]
  idempotency: 'advisory'
  # The domain of the GitHub runners is too long for the default size of the
  # nginx server names hash with the '*.s3.<domain>' wildcard names.
  inventoryspec:
    files:
      group_vars/debops_service_garage/garage.yml: |
        ---
        garage__domain: 'example.com'
  post_script: |
    garage --version
    systemctl is-active garage.service
    sudo garage status
    curl --fail --silent http://127.0.0.1:3903/health

- name: 'vmagent'
  playbook: 'service/vmagent'
  groups: [ 'debops_service_vmagent' ]
  idempotency: 'advisory'
  inventoryspec:
    files:
      group_vars/all/vmagent.yml: |
        ---
        vmagent__remote_write_urls:
          - 'http://127.0.0.1:8428/api/v1/write'
  post_script: |
    vmagent -version
    systemctl is-active vmagent@default.service
    curl -fsS http://127.0.0.1:8429/metrics | grep -q '^vm_app_version'

- name: 'prometheus_exporter'
  playbook: 'service/prometheus_exporter'
  groups: [ 'debops_service_prometheus_exporter' ]
  idempotency: 'advisory'
  inventoryspec:
    files:
      group_vars/debops_service_prometheus_exporter/prometheus_exporter.yml: |
        ---
        prometheus_exporter__group_exporters:
          - name: 'node'
  post_script: |
    systemctl is-active prometheus-node-exporter.service
    curl -fsS http://127.0.0.1:9100/metrics | grep -q '^node_exporter_build_info'

- name: 'mariadb_server'
  playbook: 'service/mariadb_server'
  groups: [ 'debops_service_mariadb_server' ]
  idempotency: 'advisory'

- name: 'postgresql_server'
  playbook: 'service/postgresql_server'
  groups: [ 'debops_service_postgresql_server' ]
  idempotency: 'advisory'

- name: 'python'
  playbook: 'service/python'
  groups: [ 'debops_service_python' ]
  idempotency: 'advisory'

- name: 'zabbix_agent'
  playbook: 'service/zabbix_agent'
  groups: [ 'debops_service_zabbix_agent' ]
  idempotency: 'advisory'
  excluded: True
  reason: 'Ubuntu 24.04 used by the hosted runners does not provide Zabbix
    packages'
