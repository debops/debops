# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

version: 2

# Set the version of Python and other tools you might need
build:
  os: "ubuntu-22.04"
  tools:
    python: "3.11"
  apt_packages:
    - 'graphviz'
  jobs:
    build:
      html:
        # Read the Docs passes '-j auto' on its own only when a project
        # has the 'build_in_parallel' feature flag enabled, so the HTML
        # build does it explicitly here. Parallel reading is stable; the
        # write phase stays serial due to the hook in 'docs/conf.py'.
        - >-
          mkdir -p $READTHEDOCS_OUTPUT/html
        - >-
          cd docs &&
          python -m sphinx -j auto -T -b html
          -d _build/doctrees -D language=en
          . $READTHEDOCS_OUTPUT/html

# Build documentation in the docs/ directory with Sphinx
sphinx:
  builder: 'html'
  configuration: 'docs/conf.py'

# Optionally build your docs in additional formats such as PDF and ePub
formats: []

# Optionally set the version of Python and requirements required to build your docs
python:
  install:
    - requirements: 'docs/requirements.txt'
