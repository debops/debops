# Manifest of the DebOps Ansible Collection bundled in the monorepo.
# The file is tracked in git so that the Collection can be installed
# directly from a git repository using 'ansible-galaxy'. The 'version'
# field is updated by 'bin/new-stable-release' in the release commit
# and stamped in the git tag; between releases it reflects the last
# released version of the Collection.

namespace: "debops"
name: "debops"
version: "3.3.2"
description: "Your Debian-based data center in a box"

authors:
  - "Maciej Delmanowski <drybjed@gmail.com>"
  - "DebOps Developers <debops-users@lists.debops.org>"

repository: "https://github.com/debops/debops"
documentation: "https://docs.debops.org/en/master/ansible/role-index.html"
homepage: "https://debops.org/"
issues: "https://github.com/debops/debops/issues"

readme: "CHANGELOG.rst"
license:
  - "AGPL-3.0-only"
  - "Apache-2.0"
  - "BSD-4-Clause"
  - "CC0-1.0"
  - "CC-BY-3.0"
  - "CC-BY-SA-4.0"
  - "GPL-2.0-only"
  - "GPL-2.0-or-later"
  - "GPL-3.0-only"
  - "GPL-3.0-or-later"
  - "ISC"
  - "MIT"
  - "OLDAP-2.8"

tags:
  - "debian"
  - "ubuntu"
  - "linux"
  - "infrastructure"
  - "debops"
  - "sysadmin"
  - "cluster"
  - "datacenter"

dependencies:
  "ansible.mysql": "*"
  "ansible.posix": "*"
  "ansible.utils": "*"
  "community.crypto": "*"
  "community.docker": "*"
  "community.general": "*"
  "community.libvirt": "*"
  "community.postgresql": "*"
  "community.rabbitmq": "*"
