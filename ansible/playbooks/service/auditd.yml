- name: Configure systemctl call logging                   # noqa: fqcn[keyword]
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_service_auditd' ]
  become: true

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  roles:

    - role: auditd
      tags: [ 'role::auditd', 'skip::auditd' ]
