- name: Remove Elasticsearch node from ES cluster
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services',
           'debops_service_elasticsearch',
           'debops_service_elasticsearch_master',
           'debops_service_elasticsearch_data',
           'debops_service_elasticsearch_ingest',
           'debops_service_elasticsearch_lb' ]
  become: True
  # Operate one host at a time to cleanly remove each from the ES cluster and
  # allow for migration of shards
  serial: '1'

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare elasticsearch environment
      ansible.builtin.import_role:
        name: 'debops.debops.elasticsearch'
        tasks_from: 'main_env'
      tags: [ 'role::elasticsearch', 'role::secret' ]

  tasks:

    - name: Remove node from Elasticsearch cluster
      ansible.builtin.import_role:
        name: 'debops.debops.elasticsearch'
        tasks_from: 'main_remove_node'
      tags: [ 'role::elasticsearch', 'skip::elasticsearch' ]
