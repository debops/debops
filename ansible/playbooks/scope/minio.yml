- name: Manage MinIO service
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_minio' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare minio environment
      ansible.builtin.import_role:
        name: 'debops.debops.minio'
        tasks_from: 'main_env'
      tags: [ 'role::minio', 'role::minio:env' ]

  tasks:

    - name: Import minio role
      ansible.builtin.import_role:
        name: 'debops.debops.minio'
      tags: [ 'role::minio', 'skip::minio' ]
