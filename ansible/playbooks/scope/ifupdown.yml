- name: Manage network configuration using ifupdown
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_ifupdown' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare ifupdown environment
      ansible.builtin.import_role:
        name: 'debops.debops.ifupdown'
        tasks_from: 'main_env'
      tags: [ 'role::ifupdown', 'role::ifupdown:env' ]

  tasks:

    - name: Import ifupdown role
      ansible.builtin.import_role:
        name: 'debops.debops.ifupdown'
      tags: [ 'role::ifupdown', 'skip::ifupdown' ]
