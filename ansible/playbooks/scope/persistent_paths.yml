- name: Ensure paths are stored on persistent storage
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_persistent_paths' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  tasks:

    - name: Import persistent_paths role
      ansible.builtin.import_role:
        name: 'debops.debops.persistent_paths'
      tags: [ 'role::persistent_paths', 'skip::persistent_paths' ]
