- name: Manage Public Key Infrastructure
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_hosts', 'debops_all_services', 'debops_service_pki' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare pki environment
      ansible.builtin.import_role:
        name: 'debops.debops.pki'
        tasks_from: 'main_env'
      tags: [ 'role::pki', 'role::pki:env' ]

  tasks:

    - name: Import pki role
      ansible.builtin.import_role:
        name: 'debops.debops.pki'
      tags: [ 'role::pki', 'skip::pki' ]
