- name: Manage Postfix postscreen configuration
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_postscreen' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  tasks:

    - name: Import DebOps global handlers
      ansible.builtin.import_role:
        name: 'debops.debops.global_handlers'
      tags: [ 'role::postscreen', 'skip::postscreen' ]

    - name: Import postfix role
      ansible.builtin.import_role:
        name: 'debops.debops.postfix'
      tags: [ 'role::postfix', 'skip::postfix', 'role::postscreen' ]

    - name: Import postscreen role
      ansible.builtin.import_role:
        name: 'debops.debops.postscreen'
      tags: [ 'role::postscreen', 'skip::postscreen' ]
