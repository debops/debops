- name: Install and manage libvirtd QEMU configuration
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_libvirtd_qemu' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  tasks:

    - name: Import DebOps global handlers
      ansible.builtin.import_role:
        name: 'debops.debops.global_handlers'
      tags: [ 'role::libvirtd_qemu', 'skip::libvirtd_qemu' ]

    - name: Import libvirtd_qemu role
      ansible.builtin.import_role:
        name: 'debops.debops.libvirtd_qemu'
      tags: [ 'role::libvirtd_qemu', 'skip::libvirtd_qemu' ]
