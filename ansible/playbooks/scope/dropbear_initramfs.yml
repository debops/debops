- name: Setup the dropbear ssh server in initramfs
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_dropbear_initramfs' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  tasks:

    - name: Import dropbear_initramfs role
      ansible.builtin.import_role:
        name: 'debops.debops.dropbear_initramfs'
      tags: [ 'role::dropbear_initramfs', 'skip::dropbear_initramfs' ]
