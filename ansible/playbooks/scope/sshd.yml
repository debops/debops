- name: Manage OpenSSH Server
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_hosts', 'debops_all_services', 'debops_service_sshd' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare sshd environment
      ansible.builtin.import_role:
        name: 'debops.debops.sshd'
        tasks_from: 'main_env'
      tags: [ 'role::sshd', 'role::sshd:env' ]

  tasks:

    - name: Import sshd role
      ansible.builtin.import_role:
        name: 'debops.debops.sshd'
      tags: [ 'role::sshd', 'skip::sshd' ]
