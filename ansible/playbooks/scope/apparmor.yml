- name: Install and configure AppArmor
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_hosts', 'debops_all_services', 'debops_service_apparmor' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  tasks:

    - name: Import DebOps global handlers
      ansible.builtin.import_role:
        name: 'debops.debops.global_handlers'
      tags: [ 'role::apparmor', 'skip::apparmor' ]

    - name: Import apparmor role
      ansible.builtin.import_role:
        name: 'debops.debops.apparmor'
      tags: [ 'role::apparmor', 'skip::apparmor' ]
