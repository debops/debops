- name: Put /etc under version control using etckeeper
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_hosts', 'debops_all_services', 'debops_service_etckeeper' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  tasks:

    - name: Import etckeeper role
      ansible.builtin.import_role:
        name: 'debops.debops.etckeeper'
      tags: [ 'role::etckeeper', 'skip::etckeeper' ]
