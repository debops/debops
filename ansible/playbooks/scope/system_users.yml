- name: Manage local users and groups
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_hosts', 'debops_all_services', 'debops_service_system_users' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  tasks:

    - name: Import system_users role
      ansible.builtin.import_role:
        name: 'debops.debops.system_users'
      tags: [ 'role::system_users', 'skip::system_users' ]
