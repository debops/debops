- name: Manage Redis server
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_redis_server' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare redis_server environment
      ansible.builtin.import_role:
        name: 'debops.debops.redis_server'
        tasks_from: 'main_env'
      tags: [ 'role::redis_server', 'role::redis_server:env' ]

  tasks:

    - name: Import redis_server role
      ansible.builtin.import_role:
        name: 'debops.debops.redis_server'
      tags: [ 'role::redis_server', 'skip::redis_server' ]
