- name: Manage Postfix configuration
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_postconf' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare postconf environment
      ansible.builtin.import_role:
        name: 'debops.debops.postconf'
        tasks_from: 'main_env'
      tags: [ 'role::postconf', 'role::postconf:env' ]

  tasks:

    - name: Import postconf role
      ansible.builtin.import_role:
        name: 'debops.debops.postconf'
      tags: [ 'role::postconf', 'skip::postconf' ]
