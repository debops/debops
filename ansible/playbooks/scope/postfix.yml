- name: Manage Postfix SMTP service
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_postfix' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare postfix environment
      ansible.builtin.import_role:
        name: 'debops.debops.postfix'
        tasks_from: 'main_env'
      tags: [ 'role::postfix', 'role::postfix:env' ]

  tasks:

    - name: Import postfix role
      ansible.builtin.import_role:
        name: 'debops.debops.postfix'
      tags: [ 'role::postfix', 'skip::postfix' ]
