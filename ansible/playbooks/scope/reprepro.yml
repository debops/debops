- name: Manage reprepro repositories
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_reprepro' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare reprepro environment
      ansible.builtin.import_role:
        name: 'debops.debops.reprepro'
        tasks_from: 'main_env'
      tags: [ 'role::reprepro', 'role::reprepro:env' ]

  tasks:

    - name: Import reprepro role
      ansible.builtin.import_role:
        name: 'debops.debops.reprepro'
      tags: [ 'role::reprepro', 'skip::reprepro' ]
