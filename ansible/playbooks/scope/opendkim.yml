- name: Manage OpenDKIM service
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_opendkim' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare opendkim environment
      ansible.builtin.import_role:
        name: 'debops.debops.opendkim'
        tasks_from: 'main_env'
      tags: [ 'role::opendkim', 'role::opendkim:env' ]

  tasks:

    - name: Import opendkim role
      ansible.builtin.import_role:
        name: 'debops.debops.opendkim'
      tags: [ 'role::opendkim', 'skip::opendkim' ]
