- name: Manage Kibana service
  collections: [ 'debops.debops' ]
  hosts: [ 'debops_all_services', 'debops_service_kibana' ]
  become: True

  environment: '{{ inventory__environment | d({})
                   | combine(inventory__group_environment | d({}))
                   | combine(inventory__host_environment  | d({})) }}'

  pre_tasks:

    - name: Prepare kibana environment
      ansible.builtin.import_role:
        name: 'debops.debops.kibana'
        tasks_from: 'main_env'
      tags: [ 'role::kibana', 'role::kibana:env', 'role::kibana:config' ]

  tasks:

    - name: Import kibana role
      ansible.builtin.import_role:
        name: 'debops.debops.kibana'
      tags: [ 'role::kibana', 'skip::kibana' ]
