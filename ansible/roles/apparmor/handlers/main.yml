- name: Reload all AppArmor profiles
  ansible.builtin.service:
    name: 'apparmor'
    state: 'reloaded'
  when: ansible_local.apparmor.installed | d(False) | bool

- name: Update GRUB (AppArmor)
  ansible.builtin.command: update-grub
  register: apparmor__register_update_grub
  changed_when: apparmor__register_update_grub.changed | bool
  failed_when: ('error' in apparmor__register_update_grub.stderr)
