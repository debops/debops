# The order of the imports affects the execution order of handlers.

- name: Import meta handlers
  ansible.builtin.import_tasks: 'meta.yml'

- name: Import systemd handlers
  ansible.builtin.import_tasks: 'systemd.yml'

- name: Import xinetd handlers
  ansible.builtin.import_tasks: 'xinetd.yml'

# Handlers from the debops.etckeeper role are loaded last
# (when the role itself runs) to commit changes at the end of playbooks.
