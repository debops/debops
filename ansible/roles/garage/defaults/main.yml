# .. envvar:: garage__nginx__dependent_servers [[[
#
# Server configuration for the :ref:`debops.nginx` Ansible role.
garage__nginx__dependent_servers:

  - name: [ '{{ garage__nginx_s3_fqdn }}', '{{ "*" + garage__s3_root_domain }}' ]
    filename: 'garage-s3'
    state: '{{ "present"
               if (garage__deploy_state == "present" and
                   garage__nginx_enabled | bool)
               else "absent" }}'
    type: 'proxy'
    options: |-
      client_max_body_size 0;
      proxy_buffering off;
      ignore_invalid_headers off;
    proxy_pass: 'http://garage-s3'
    proxy_options: |-
      proxy_http_version 1.1;
      proxy_read_timeout 15m;
      proxy_send_timeout 15m;
      proxy_request_buffering off;
      proxy_max_temp_file_size 0;
    proxy_headers: |-
      proxy_set_header Host              $http_host;
      proxy_set_header X-Real-IP         $remote_addr;
      proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;

  - name: [ '{{ garage__nginx_web_fqdn }}', '{{ "*" + garage__web_root_domain }}' ]
    filename: 'garage-web'
    state: '{{ "present"
               if (garage__deploy_state == "present" and
                   garage__nginx_enabled | bool and
                   garage__nginx_web_enabled | bool)
               else "absent" }}'
    type: 'proxy'
    proxy_pass: 'http://garage-web'
