- name: Import custom Ansible plugins
  ansible.builtin.import_role:
    name: 'ansible_plugins'

- name: Import DebOps global handlers
  ansible.builtin.import_role:
    name: 'global_handlers'

- name: Import DebOps secret role
  ansible.builtin.import_role:
    name: 'secret'

# Package installation [[[1
# Stop the service *before* the package removal below, since purging
# 'zabbix-server-pgsql'/'zabbix-server-mysql' also removes the
# 'zabbix-server.service' unit file -- stopping it afterwards would fail
# with "Could not find the requested service".
- name: Check if Zabbix Server systemd unit is present
  ansible.builtin.stat:
    path: '/lib/systemd/system/zabbix-server.service'
  register: zabbix_server__register_systemd_unit
  when: zabbix_server__deploy_state == 'absent'

- name: Make sure Zabbix Server service is stopped and disabled before removal
  ansible.builtin.systemd:
    name: 'zabbix-server'
    enabled: False
    state: 'stopped'
  when: zabbix_server__deploy_state == 'absent' and
        zabbix_server__register_systemd_unit.stat.exists | d(False)

- name: Install Zabbix Server packages
  ansible.builtin.apt:
    name: '{{ zabbix_server__combined_packages | flatten }}'
    state: '{{ "present" if zabbix_server__deploy_state != "absent" else "absent" }}'
    purge: '{{ True if zabbix_server__deploy_state == "absent" else omit }}'
  register: zabbix_server__register_packages
  until: zabbix_server__register_packages is succeeded

- name: Add Zabbix Server UNIX account to required groups
  ansible.builtin.user:
    name: '{{ zabbix_server__user }}'
    groups: '{{ zabbix_server__additional_groups | join(",") }}'
    state: 'present'
    append: True
  notify: [ 'Check zabbix-server and restart' ]
  when: zabbix_server__deploy_state != 'absent' and
        zabbix_server__additional_groups | length > 0

# Main configuration file [[[1
- name: Ensure Zabbix Server configuration drop-in directory exists
  ansible.builtin.file:
    path: '{{ zabbix_server__conf_directory }}'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: zabbix_server__deploy_state != 'absent'

- name: Generate Zabbix Server configuration file
  ansible.builtin.template:
    src: 'etc/zabbix/zabbix_server.d/ansible.conf.j2'
    dest: '{{ zabbix_server__conf_file_path }}'
    owner: 'root'
    group: '{{ zabbix_server__group }}'
    mode: '0640'
    unsafe_writes: '{{ True if (core__unsafe_writes | d(ansible_local.core.unsafe_writes | d()) | bool) else omit }}'
  no_log: '{{ debops__no_log | d(True) }}'
  notify: [ 'Check zabbix-server and restart' ]
  when: zabbix_server__deploy_state != 'absent'

- name: Remove Zabbix Server configuration file
  ansible.builtin.file:
    path: '{{ zabbix_server__conf_file_path }}'
    state: 'absent'
  when: zabbix_server__deploy_state == 'absent'

# Ansible facts [[[1
- name: Make sure that Ansible local fact directory exists
  ansible.builtin.file:
    path: '/etc/ansible/facts.d'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'

- name: Create local facts of Zabbix Server
  ansible.builtin.template:
    src: 'etc/ansible/facts.d/zabbix_server.fact.j2'
    dest: '/etc/ansible/facts.d/zabbix_server.fact'
    owner: 'root'
    group: 'root'
    mode: '0644'
    unsafe_writes: '{{ True if (core__unsafe_writes | d(ansible_local.core.unsafe_writes | d()) | bool) else omit }}'
  notify: [ 'Refresh host facts' ]
  tags: [ 'meta::facts' ]

- name: Reload facts if they were modified
  ansible.builtin.meta: 'flush_handlers'

# Database schema [[[1
- name: Import Zabbix database schema
  ansible.builtin.import_tasks: 'schema.yml'
  when: zabbix_server__deploy_state != 'absent' and
        zabbix_server__database == 'postgresql'
  tags: [ 'role::zabbix_server:schema' ]

# Web frontend [[[1
# Always imported, even when 'zabbix_server__frontend_enabled' is False: the
# task file itself decides between generating and removing the frontend
# configuration, so that disabling the frontend actually cleans up a
# previously generated 'zabbix.conf.php' instead of leaving it in place.
- name: Configure Zabbix web frontend
  ansible.builtin.import_tasks: 'frontend.yml'
  tags: [ 'role::zabbix_server:frontend' ]

# Service management [[[1
# The 'absent' side of this is already handled above, before the package
# holding the systemd unit is purged.
- name: Make sure Zabbix Server service is enabled and started
  ansible.builtin.systemd:
    name: 'zabbix-server'
    enabled: True
    state: 'started'
  when: zabbix_server__deploy_state != 'absent'

- name: Flush handlers before managing API objects
  ansible.builtin.meta: 'flush_handlers'

# Zabbix API objects [[[1
- name: Bootstrap Zabbix API credentials
  ansible.builtin.import_tasks: 'api_bootstrap.yml'
  when: zabbix_server__deploy_state != 'absent' and
        zabbix_server__api_enabled | bool
  tags: [ 'role::zabbix_server:api' ]

- name: Manage global Zabbix API objects
  ansible.builtin.import_tasks: 'api_objects.yml'
  when: zabbix_server__deploy_state != 'absent' and
        zabbix_server__api_enabled | bool and
        (zabbix_server__register_api_token_content | d('')) | trim | length > 0
  tags: [ 'role::zabbix_server:api' ]
