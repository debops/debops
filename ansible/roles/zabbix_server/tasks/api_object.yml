# Creates or updates the objects from a single list of Zabbix API objects,
# described by the 'zabbix_server__object' variable. The objects are matched
# by their natural key ('name', or 'username' for users) to decide between
# the 'create' and 'update' API methods. The entries are passed to the API as
# they are, without the keys added by the 'parse_kv_items' filter.
#
# The optional 'create_only' list contains parameters sent only when an object
# is created. The password of a user is one of them, because the API ends all
# sessions of the user on each update with a password, even an unchanged one.
#
# The optional 'create_requires' parameter is required by the API to create an
# object. An entry without it can only update an existing object.
#
# The optional 'method_suffix' is appended to the names of the 'create',
# 'update' and 'delete' methods, and 'get_params' are added to the 'get'
# method, for the global macros managed by the 'usermacro.*global' methods.

- name: Manage Zabbix objects from the list of {{ zabbix_server__object.list }}
  when: zabbix_server__object_items | length > 0
  vars:
    zabbix_server__object_items: '{{ lookup("vars", "zabbix_server__combined_" + zabbix_server__object.list)
                                     | debops.debops.parse_kv_items(name=zabbix_server__object.key)
                                     | selectattr("state", "equalto", "present") | list }}'
    zabbix_server__object_ids: '{{ zabbix_server__register_objects.json.result | d([])
                                   | items2dict(key_name=zabbix_server__object.key,
                                                value_name=zabbix_server__object.id) }}'
  block:

    - name: Look up Zabbix objects from the list of {{ zabbix_server__object.list }}
      ansible.builtin.uri:
        url: '{{ zabbix_server__api_url }}'
        method: 'POST'
        headers:
          Authorization: 'Bearer {{ zabbix_server__register_api_token_content }}'
          Content-Type: 'application/json-rpc'
        body_format: 'json'
        body:
          jsonrpc: '2.0'
          method: '{{ zabbix_server__object.api }}.get'
          params: '{{ {"output": [zabbix_server__object.id, zabbix_server__object.key],
                       "filter": {zabbix_server__object.key: zabbix_server__object_items
                                                             | map(attribute=zabbix_server__object.key) | list}}
                      | combine(zabbix_server__object.get_params | d({})) }}'
          id: 1
        validate_certs: '{{ zabbix_server__api_validate_certs }}'
        return_content: True
      delegate_to: '{{ zabbix_server__api_delegate_to }}'
      become: False
      check_mode: False
      register: zabbix_server__register_objects
      failed_when: >-
        (zabbix_server__register_objects.status | d(0)) != 200
        or zabbix_server__register_objects.json.result is not defined
      no_log: '{{ debops__no_log | d(True) }}'

    - name: Create or update Zabbix objects from the list of {{ zabbix_server__object.list }}
      ansible.builtin.uri:
        url: '{{ zabbix_server__api_url }}'
        method: 'POST'
        headers:
          Authorization: 'Bearer {{ zabbix_server__register_api_token_content }}'
          Content-Type: 'application/json-rpc'
        body_format: 'json'
        body:
          jsonrpc: '2.0'
          method: '{{ zabbix_server__object.api
                      + (".update" if (item[zabbix_server__object.key] in zabbix_server__object_ids) else ".create")
                      + zabbix_server__object.method_suffix | d("") }}'
          params: '{{ item | dict2items
                      | rejectattr("key", "in", ["state", "id", "weight", "first_index", "comment",
                                                 "options", "anchor_to"]
                                                + (zabbix_server__object.create_only | d([])
                                                   if (item[zabbix_server__object.key] in zabbix_server__object_ids)
                                                   else []))
                      | list | items2dict
                      | combine({zabbix_server__object.id: zabbix_server__object_ids[item[zabbix_server__object.key]]}
                                if (item[zabbix_server__object.key] in zabbix_server__object_ids)
                                else {}) }}'
          id: 1
        validate_certs: '{{ zabbix_server__api_validate_certs }}'
        return_content: True
      loop: '{{ zabbix_server__object_items }}'
      when: item[zabbix_server__object.key] in zabbix_server__object_ids or
            zabbix_server__object.create_requires | d(zabbix_server__object.key) in item
      loop_control:
        label: '{{ item[zabbix_server__object.key] }}'
      delegate_to: '{{ zabbix_server__api_delegate_to }}'
      become: False
      register: zabbix_server__register_object_result
      changed_when: item[zabbix_server__object.key] not in zabbix_server__object_ids
      failed_when: >-
        (zabbix_server__register_object_result.status | d(0)) != 200
        or zabbix_server__register_object_result.json.result is not defined
      no_log: '{{ debops__no_log | d(True) }}'
