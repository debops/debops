# Manages global Zabbix objects (media types, actions, user groups, users,
# custom templates, host item overrides) via the JSON-RPC API, using the
# token bootstrapped in 'api_bootstrap.yml'. Each object list is a list of
# raw API method parameters (see the Zabbix API reference), matched by its
# natural key ('name', or 'username' for users) to decide between the
# 'create' and 'update' API methods.

# Media types [[[1
- name: Look up existing Zabbix media types
  ansible.builtin.uri:
    url: '{{ zabbix_server__api_url }}'
    method: 'POST'
    headers:
      Authorization: 'Bearer {{ zabbix_server__register_api_token_content }}'
      Content-Type: 'application/json-rpc'
    body_format: 'json'
    body:
      jsonrpc: '2.0'
      method: 'mediatype.get'
      params:
        output: [ 'mediatypeid', 'name' ]
        filter:
          name: '{{ zabbix_server__media_types | map(attribute="name") | list }}'
      id: 1
    validate_certs: '{{ zabbix_server__api_validate_certs }}'
    return_content: True
  delegate_to: '{{ zabbix_server__api_delegate_to }}'
  become: False
  register: zabbix_server__register_api_media_types
  failed_when: zabbix_server__register_api_media_types.json.error is defined
  no_log: '{{ debops__no_log | d(True) }}'
  when: zabbix_server__media_types | length > 0

- name: Create or update Zabbix media types
  ansible.builtin.uri:
    url: '{{ zabbix_server__api_url }}'
    method: 'POST'
    headers:
      Authorization: 'Bearer {{ zabbix_server__register_api_token_content }}'
      Content-Type: 'application/json-rpc'
    body_format: 'json'
    body:
      jsonrpc: '2.0'
      method: >-
        {{ "mediatype.update"
           if (item.name in (zabbix_server__register_api_media_types.json.result | d([]) | map(attribute="name") | list))
           else "mediatype.create" }}
      params: >-
        {{ item | combine(
             {'mediatypeid': (zabbix_server__register_api_media_types.json.result
                               | selectattr("name", "equalto", item.name)
                               | map(attribute="mediatypeid") | first)}
             if (item.name in (zabbix_server__register_api_media_types.json.result | d([]) | map(attribute="name") | list))
             else {}) }}
      id: 1
    validate_certs: '{{ zabbix_server__api_validate_certs }}'
    return_content: True
  loop: '{{ zabbix_server__media_types }}'
  loop_control:
    label: '{{ item.name }}'
  delegate_to: '{{ zabbix_server__api_delegate_to }}'
  become: False
  register: zabbix_server__register_api_media_type_result
  failed_when: zabbix_server__register_api_media_type_result.json.error is defined
  no_log: '{{ debops__no_log | d(True) }}'
  when: zabbix_server__media_types | length > 0

