# Custom templates [[[1
- name: Import custom Zabbix templates
  ansible.builtin.uri:
    url: '{{ zabbix_server__api_url }}'
    method: 'POST'
    headers:
      Authorization: 'Bearer {{ zabbix_server__register_api_token_content }}'
      Content-Type: 'application/json-rpc'
    body_format: 'json'
    body:
      jsonrpc: '2.0'
      method: 'configuration.import'
      params:
        format: 'json'
        source: '{{ item.source }}'
        rules:
          template_groups: { createMissing: True }
          templates: { createMissing: True, updateExisting: True }
          items: { createMissing: True, updateExisting: True }
          triggers: { createMissing: True, updateExisting: True }
          graphs: { createMissing: True, updateExisting: True }
          templateDashboards: { createMissing: True, updateExisting: True }
          templateLinkage: { createMissing: True }
          valueMaps: { createMissing: True, updateExisting: True }
      id: 1
    validate_certs: '{{ zabbix_server__api_validate_certs }}'
    return_content: True
  loop: '{{ zabbix_server__templates }}'
  loop_control:
    label: '{{ item.name }}'
  delegate_to: '{{ zabbix_server__api_delegate_to }}'
  become: False
  register: zabbix_server__register_api_template_result
  failed_when: zabbix_server__register_api_template_result.json.error is defined
  changed_when: (zabbix_server__register_api_template_result.json.result | d()) | bool
  when: zabbix_server__templates | length > 0

# Host item overrides [[[1
- name: Apply host item overrides
  ansible.builtin.include_tasks: 'host_item_override.yml'
  loop: '{{ zabbix_server__host_item_overrides }}'
  loop_control:
    loop_var: 'zabbix_server__override'
    label: '{{ zabbix_server__override.template }}'
  when: zabbix_server__host_item_overrides | length > 0
