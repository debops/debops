- name: Check zabbix-server and restart
  ansible.builtin.command: '/usr/sbin/zabbix_server -T'
  register: zabbix_server__register_config_test
  changed_when: zabbix_server__register_config_test is changed
  notify: [ 'Restart zabbix-server' ]

- name: Restart zabbix-server
  ansible.builtin.service:
    name: 'zabbix-server'
    state: 'restarted'
