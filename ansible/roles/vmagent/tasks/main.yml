- name: Import custom Ansible plugins
  ansible.builtin.import_role:
    name: 'ansible_plugins'

- name: Import DebOps global handlers
  ansible.builtin.import_role:
    name: 'global_handlers'

- name: Import DebOps secret role
  ansible.builtin.import_role:
    name: 'secret'

- name: Pre hooks
  ansible.builtin.include_tasks: '{{ lookup("debops.debops.task_src", "vmagent/pre_main.yml") }}'

- name: Make sure that Ansible local fact directory exists
  ansible.builtin.file:
    path: '/etc/ansible/facts.d'
    state: 'directory'
    mode: '0755'

- name: Create vmagent system group
  ansible.builtin.group:
    name: '{{ vmagent__group }}'
    state: 'present'
    system: True
  when: vmagent__deploy_state != 'absent'

- name: Create vmagent system user
  ansible.builtin.user:
    name: '{{ vmagent__user }}'
    group: '{{ vmagent__group }}'
    home: '{{ vmagent__home }}'
    shell: '{{ vmagent__shell }}'
    system: True
    create_home: True
    state: 'present'
  when: vmagent__deploy_state != 'absent'

- name: Create vmagent configuration directory
  ansible.builtin.file:
    path: '{{ vmagent__config_dir }}'
    state: 'directory'
    owner: 'root'
    group: '{{ vmagent__group }}'
    mode: '0750'
  when: vmagent__deploy_state != 'absent'

- name: Create vmagent state directory
  ansible.builtin.file:
    path: '{{ vmagent__home }}'
    state: 'directory'
    owner: '{{ vmagent__user }}'
    group: '{{ vmagent__group }}'
    mode: '0750'
  when: vmagent__deploy_state != 'absent'

- name: Create vmagent download cache directory
  ansible.builtin.file:
    path: '{{ vmagent__cache_dir }}'
    state: 'directory'
    owner: 'root'
    group: 'root'
    mode: '0755'
  when: vmagent__deploy_state != 'absent' and
        not (vmagent__skip_install | bool)

- name: Assert host architecture is supported by vmagent
  ansible.builtin.assert:
    that:
      - ansible_architecture in vmagent__arch_map
    fail_msg: >-
      vmagent has no release archive for architecture
      '{{ ansible_architecture }}'. Supported uname architectures:
      {{ vmagent__arch_map.keys() | list | sort }}.
  when: vmagent__deploy_state != 'absent' and
        not (vmagent__skip_install | bool)

- name: Install vmagent binary
  ansible.builtin.include_tasks: 'install_binary.yml'
  when: vmagent__deploy_state != 'absent' and
        not (vmagent__skip_install | bool)

- name: Save vmagent local facts
  ansible.builtin.template:
    src: 'etc/ansible/facts.d/vmagent.fact.j2'
    dest: '/etc/ansible/facts.d/vmagent.fact'
    mode: '0755'
  notify: [ 'Refresh host facts' ]
  tags: [ 'meta::facts' ]

- name: Reload Ansible local facts
  ansible.builtin.meta: 'flush_handlers'

- name: Install vmagent systemd template unit
  ansible.builtin.template:
    src: 'etc/systemd/system/vmagent@.service.j2'
    dest: '/etc/systemd/system/vmagent@.service'
    owner: 'root'
    group: 'root'
    mode: '0644'
  notify: [ 'Reload service manager' ]
  when: vmagent__deploy_state != 'absent'

- name: Remove leftover vmagent instances
  when: vmagent__deploy_state == 'absent'
  block:

    - name: List leftover vmagent systemd instances
      ansible.builtin.command:
        argv:
          - systemctl
          - list-units
          - --all
          - --no-legend
          - --plain
          - 'vmagent@*.service'
      register: vmagent__register_units
      changed_when: false
      failed_when: false

    - name: Find leftover role-managed instance files
      ansible.builtin.find:
        paths:
          - '{{ vmagent__config_dir }}'
          - '{{ vmagent__home }}'
        patterns:
          - '*.yml'
          - '*.env'
        file_type: file
      register: vmagent__register_instance_files
      failed_when: false

    - name: Find leftover persistent queue directories
      ansible.builtin.find:
        paths:
          - '{{ vmagent__home }}'
        file_type: directory
        recurse: false
      register: vmagent__register_queue_dirs
      failed_when: false

    - name: Stop and disable leftover vmagent instances
      ansible.builtin.systemd:
        name: 'vmagent@{{ item }}.service'
        enabled: false
        state: 'stopped'
      register: vmagent__register_stop_leftover
      failed_when:
        - vmagent__register_stop_leftover is failed
        - "'Could not find the requested service' not in (vmagent__register_stop_leftover.msg | d(''))"
        - (vmagent__register_stop_leftover.status.LoadState | d('')) != 'not-found'
      loop: '{{
          (
            (vmagent__register_units.stdout_lines | d([]))
            | map("split") | map("first")
            | select("match", "^vmagent@.+\.service$")
            | map("regex_replace", "^vmagent@(.+)\\.service$", "\\1") | list
          )
          +
          (
            (vmagent__register_instance_files.files | d([]))
            | map(attribute="path") | map("basename")
            | map("regex_replace", "\\.(yml|env)$", "") | list
          )
          +
          (
            (vmagent__register_queue_dirs.files | d([]))
            | map(attribute="path") | map("basename") | list
          )
        ) | unique }}'

    - name: Remove leftover instance files
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: 'absent'
      loop: '{{ vmagent__register_instance_files.files | d([]) }}'
      loop_control:
        label: '{{ item.path }}'

    - name: Remove leftover persistent queue directories
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: 'absent'
      loop: '{{ vmagent__register_queue_dirs.files | d([]) }}'
      loop_control:
        label: '{{ item.path }}'

- name: Remove vmagent systemd template unit
  ansible.builtin.file:
    path: '/etc/systemd/system/vmagent@.service'
    state: 'absent'
  notify: [ 'Reload service manager' ]
  when: vmagent__deploy_state == 'absent'

- name: Flush handlers before managing instances
  ansible.builtin.meta: 'flush_handlers'

- name: Manage vmagent instances
  ansible.builtin.include_tasks: 'manage_instance.yml'
  loop: '{{ vmagent__combined_instances }}'
  loop_control:
    loop_var: 'instance'
    label: '{{ instance.name }}'
  when: vmagent__deploy_state != 'absent'

- name: Remove vmagent binary when deploy state is absent
  ansible.builtin.file:
    path: '{{ vmagent__bin_path }}'
    state: 'absent'
  when: vmagent__deploy_state == 'absent'

- name: Remove vmagent configuration directory when deploy state is absent
  ansible.builtin.file:
    path: '{{ vmagent__config_dir }}'
    state: 'absent'
  when: vmagent__deploy_state == 'absent'

- name: Post hooks
  ansible.builtin.include_tasks: '{{ lookup("debops.debops.task_src", "vmagent/post_main.yml") }}'
