- name: Import custom Ansible plugins
  ansible.builtin.import_role:
    name: 'ansible_plugins'

- name: Import DebOps secret role
  ansible.builtin.import_role:
    name: 'secret'

- name: Pre hooks
  ansible.builtin.include_tasks: '{{ lookup("debops.debops.task_src", "cloudflared/pre_main.yml") }}'

- name: Make sure that Ansible local fact directory exists
  ansible.builtin.file:
    path: '/etc/ansible/facts.d'
    state: 'directory'
    mode: '0755'

- name: Create cloudflared system group
  ansible.builtin.group:
    name: '{{ cloudflared__group }}'
    state: 'present'
    system: True
  when: cloudflared__deploy_state != 'absent'

- name: Create cloudflared system user
  ansible.builtin.user:
    name: '{{ cloudflared__user }}'
    group: '{{ cloudflared__group }}'
    home: '{{ cloudflared__home }}'
    shell: '{{ cloudflared__shell }}'
    system: True
    create_home: True
    state: 'present'
  when: cloudflared__deploy_state != 'absent'

# In check mode the APT repository, the template unit and the directories of
# the role are not created. On a host where the role was not applied yet, the
# package cannot be found and the tunnel tasks fail without them, therefore
# the package installation and the tunnel tasks are skipped in check mode
# until the template unit is installed. On other hosts check mode reports
# all changes as usual.
- name: Check whether the cloudflared systemd template unit is installed
  ansible.builtin.stat:
    path: '/etc/systemd/system/cloudflared@.service'
  register: cloudflared__register_unit_stat
  when: cloudflared__deploy_state != 'absent'

- name: Install cloudflared packages
  ansible.builtin.apt:
    name: '{{ (cloudflared__base_packages + cloudflared__packages) | flatten }}'
    state: 'present'
    install_recommends: False
  register: cloudflared__register_packages
  until: cloudflared__register_packages is succeeded
  when:
    - cloudflared__deploy_state != 'absent'
    - (cloudflared__register_unit_stat.stat.exists | d(False) | bool) or
      not (ansible_check_mode | bool)

- name: Create cloudflared configuration directory
  ansible.builtin.file:
    path: '{{ cloudflared__config_dir }}'
    state: 'directory'
    owner: 'root'
    group: '{{ cloudflared__group }}'
    mode: '0750'
  when: cloudflared__deploy_state != 'absent'

- name: Create cloudflared credentials directory
  ansible.builtin.file:
    path: '{{ cloudflared__credentials_dir }}'
    state: 'directory'
    owner: '{{ cloudflared__user }}'
    group: '{{ cloudflared__group }}'
    mode: '0700'
  when: cloudflared__deploy_state != 'absent'

- name: Create cloudflared log directory
  ansible.builtin.file:
    path: '{{ cloudflared__log_dir }}'
    state: 'directory'
    owner: '{{ cloudflared__user }}'
    group: '{{ cloudflared__group }}'
    mode: '0750'
  when: cloudflared__deploy_state != 'absent'

- name: Install cloudflared systemd template unit
  ansible.builtin.template:
    src: 'etc/systemd/system/cloudflared@.service.j2'
    dest: '/etc/systemd/system/cloudflared@.service'
    owner: 'root'
    group: 'root'
    mode: '0644'
  register: cloudflared__register_unit
  notify:
    - 'Reload service manager'
  when: cloudflared__deploy_state != 'absent'

- name: Remove cloudflared installation
  when: cloudflared__deploy_state == 'absent'
  block:

    # Tunnels are found both in the inventory and in the local facts, which
    # list configuration files and systemd instances present on the host.
    # Only a missing unit is tolerated here; any other error stops the play
    # before the configuration and credentials are removed.
    - name: Stop and disable cloudflared tunnels
      ansible.builtin.systemd:
        name: 'cloudflared@{{ item }}.service'
        enabled: False
        state: 'stopped'
      register: cloudflared__register_leftover_stop
      failed_when:
        - cloudflared__register_leftover_stop is failed
        - "'Could not find the requested service' not in (cloudflared__register_leftover_stop.msg | d(''))"
        - (cloudflared__register_leftover_stop.status.LoadState | d('')) != 'not-found'
      loop: '{{ (ansible_local.cloudflared.tunnels | d([]) | map(attribute="name") | list)
                | union(cloudflared__combined_tunnels | debops.debops.parse_kv_items
                        | map(attribute="name") | list) }}'

    - name: Remove cloudflared directories
      ansible.builtin.file:
        path: '{{ item }}'
        state: 'absent'
      loop:
        - '{{ cloudflared__config_dir }}'
        - '{{ cloudflared__credentials_dir }}'
        - '{{ cloudflared__log_dir }}'

    - name: Remove cloudflared systemd template unit
      ansible.builtin.file:
        path: '/etc/systemd/system/cloudflared@.service'
        state: 'absent'
      notify: [ 'Reload service manager' ]

    - name: Remove cloudflared packages
      ansible.builtin.apt:
        name: '{{ (cloudflared__base_packages + cloudflared__packages) | flatten }}'
        state: 'absent'
      register: cloudflared__register_packages_remove
      until: cloudflared__register_packages_remove is succeeded

- name: Flush handlers before managing tunnels
  ansible.builtin.meta: 'flush_handlers'

# Skipped in check mode on a host without the template unit, see above.
- name: Manage cloudflared tunnel instances
  ansible.builtin.include_tasks: 'manage_tunnel.yml'
  loop: '{{ cloudflared__combined_tunnels | debops.debops.parse_kv_items }}'
  loop_control:
    loop_var: 'tunnel'
    label: '{{ tunnel.name }}'
  when:
    - cloudflared__deploy_state != 'absent'
    - tunnel.state | d('present') in [ 'present', 'absent' ]
    - (cloudflared__register_unit_stat.stat.exists | d(False) | bool) or
      not (ansible_check_mode | bool)

- name: Save cloudflared local facts
  ansible.builtin.template:
    src: 'etc/ansible/facts.d/cloudflared.fact.j2'
    dest: '/etc/ansible/facts.d/cloudflared.fact'
    mode: '0755'
  notify: [ 'Refresh host facts' ]
  tags: [ 'meta::facts' ]

- name: Reload Ansible local facts
  ansible.builtin.meta: 'flush_handlers'

- name: Post hooks
  ansible.builtin.include_tasks: '{{ lookup("debops.debops.task_src", "cloudflared/post_main.yml") }}'
