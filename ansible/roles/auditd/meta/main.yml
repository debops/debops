# Ensure that custom Ansible plugins and modules included in the main DebOps
# collection are available to roles in other collections.
collections: [ 'debops.debops' ]  # noqa: fqcn[keyword]

dependencies: []

galaxy_info:

  author: '@seven-beep'
  description: 'Userspace component to the Linux Auditing System.'
  company: 'Debops'
  license: 'GPL-3.0-only'
  min_ansible_version: '2.1.3'

  platforms:

    - name: Debian
      versions:
        - all

    - name: Ubuntu
      versions:
        - all

  galaxy_tags:
    - 'audit'
    - 'logs'
    - 'security'
