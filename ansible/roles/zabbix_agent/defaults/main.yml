                                                                   # ]]]
# .. envvar:: zabbix_agent__host_user_parameters [[[
#
# Additional list of UserParameters, defined on specific hosts in the
# Ansible inventory. See :envvar:`zabbix_agent__user_parameters` for more
# details.
zabbix_agent__host_user_parameters: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__combined_user_parameters [[[
#
# Variable which combines all UserParameter lists together and is used in
# role tasks and templates.
zabbix_agent__combined_user_parameters: '{{ zabbix_agent__user_parameters
                                          + zabbix_agent__group_user_parameters
                                          + zabbix_agent__host_user_parameters
                                          + zabbix_agent__cgroup_metrics__user_parameters }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__cgroup_metrics [[[
#
# Enable built-in UserParameters (``ct.cpu.util``, ``ct.memory.used``,
# ``ct.memory.util``) which report resource usage of an LXC container based
# on its cgroup, instead of the host-wide values that LXCFS exposes for
# items like ``system.cpu.load`` or ``system.cpu.util`` inside a container
# (a noisy neighbour container will otherwise trigger identical alerts on
# every container on the same host). Can be one of:
#
# - ``auto``: enable automatically when :command:`ansible_virtualization_type`
#   fact is ``lxc`` (default)
# - ``True``: always enable
# - ``False``: always disable
zabbix_agent__cgroup_metrics: 'auto'

                                                                   # ]]]
# .. envvar:: zabbix_agent__cgroup_metrics__enabled [[[
#
# Variable which controls if the built-in cgroup metrics are enabled on
# a given host, based on :envvar:`zabbix_agent__cgroup_metrics`.
zabbix_agent__cgroup_metrics__enabled: '{{ (ansible_virtualization_type | d("") == "lxc")
                                            if (zabbix_agent__cgroup_metrics == "auto")
                                            else (zabbix_agent__cgroup_metrics | bool) }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__cgroup_metrics__scripts [[[
#
# List of helper scripts required by the built-in cgroup metrics, added to
# :envvar:`zabbix_agent__combined_scripts` when cgroup metrics are enabled.
zabbix_agent__cgroup_metrics__scripts: '{{ [{"name": "ct-cpu-util.sh", "src": "cgroup/ct-cpu-util.sh", "mode": "0755"},
    {"name": "ct-memory-used.sh", "src": "cgroup/ct-memory-used.sh", "mode": "0755"},
    {"name": "ct-memory-util.sh", "src": "cgroup/ct-memory-util.sh", "mode": "0755"}]
  if zabbix_agent__cgroup_metrics__enabled else [] }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__cgroup_metrics__user_parameters [[[
#
# List of UserParameters required by the built-in cgroup metrics, added to
# :envvar:`zabbix_agent__combined_user_parameters` when cgroup metrics are
# enabled.
zabbix_agent__cgroup_metrics__user_parameters: '{{ [{"key": "ct.cpu.util", "command": (zabbix_agent__scripts_path + "/ct-cpu-util.sh"),
     "comment": "LXC container CPU utilization based on cgroup usage_usec"},
    {"key": "ct.memory.used", "command": (zabbix_agent__scripts_path + "/ct-memory-used.sh"),
     "comment": "LXC container memory pressure in bytes (MemTotal - MemAvailable)"},
    {"key": "ct.memory.util", "command": (zabbix_agent__scripts_path + "/ct-memory-util.sh"),
     "comment": "LXC container memory pressure in percent (MemTotal - MemAvailable)"}]
  if zabbix_agent__cgroup_metrics__enabled else [] }}'
                                                                   # ]]]
                                                                   # ]]]
# API self-registration [[[
# -------------------------

# These variables configure optional self-registration of the current host
# in Zabbix Server via its JSON-RPC API, as an alternative to the built-in
# Zabbix "active agent auto-registration" mechanism (which cannot assign
# a TLS certificate to a newly created host, and therefore does not work
# well together with :envvar:`zabbix_agent__tls_mode` set to ``cert``). This
# requires network access from :envvar:`zabbix_agent__api_delegate_to` to the
# Zabbix API, and an existing API token, usually bootstrapped by the
# :ref:`debops.zabbix_server` role and stored in the DebOps ``secret/``
# directory.

# .. envvar:: zabbix_agent__api_register [[[
#
# Enable or disable self-registration of the current host in Zabbix Server
# via its API.
zabbix_agent__api_register: False

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_url [[[
#
# URL of the Zabbix Server API endpoint, for example
# ``https://zabbix.example.org/api_jsonrpc.php``. Required when
# :envvar:`zabbix_agent__api_register` is enabled.
zabbix_agent__api_url: ''

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_delegate_to [[[
#
# Host on which the Ansible tasks that communicate with the Zabbix API will
# be executed. By default this is the Ansible Controller (``localhost``),
# since the API is reachable over the network and the managed host itself
# might not have (or need) outgoing access to it. Change this if the API
# should be reached through a specific jump host instead.
zabbix_agent__api_delegate_to: 'localhost'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_validate_certs [[[
#
# Verify the TLS certificate of the Zabbix API endpoint when set to ``True``.
zabbix_agent__api_validate_certs: True

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_token_path [[[
#
# Relative path, within the DebOps ``secret/`` directory, to the file which
# holds the Zabbix API token used for authentication.
zabbix_agent__api_token_path: 'zabbix/api_token'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_token [[[
#
# Zabbix API token read from the DebOps ``secret/`` directory. See
# :envvar:`zabbix_agent__api_token_path` for the file location.
zabbix_agent__api_token: '{{ (lookup("file", secret + "/" + zabbix_agent__api_token_path))
                              | trim }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_host_name [[[
#
# Technical name of the host object created in Zabbix. Should match the
# ``Hostname`` configuration option, if it's defined.
zabbix_agent__api_host_name: '{{ ansible_fqdn }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_visible_name [[[
#
# Human readable name of the host object created in Zabbix, shown in the web
# interface.
zabbix_agent__api_visible_name: '{{ ansible_fqdn }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_status [[[
#
# Status of the created host: ``0`` - monitored, ``1`` - unmonitored.
zabbix_agent__api_status: 0

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_interface_useip [[[
#
# Whether the Zabbix Server should connect to the agent using its IP address
# (``1``) or DNS name (``0``) for passive checks.
zabbix_agent__api_interface_useip: 0

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_interface_ip [[[
#
# IP address used in the host interface definition.
zabbix_agent__api_interface_ip: '{{ ansible_default_ipv4.address
                                     if (ansible_default_ipv4.address | d())
                                     else (ansible_host | d(ansible_fqdn)) }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_interface_dns [[[
#
# DNS name used in the host interface definition.
zabbix_agent__api_interface_dns: '{{ ansible_fqdn }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_interface_port [[[
#
# Port used in the host interface definition, for passive checks.
zabbix_agent__api_interface_port: '10050'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_host_groups [[[
#
# List of Zabbix host group names the host should be a member of, defined on
# all hosts in the Ansible inventory. Missing host groups will be created
# automatically. This variable should not be modified directly, see the
# ``group``/``host`` variables below.
zabbix_agent__api_host_groups: [ 'Linux servers' ]

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_group_host_groups [[[
#
# Additional list of Zabbix host group names, defined on hosts in a specific
# Ansible inventory group.
zabbix_agent__api_group_host_groups: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_host_host_groups [[[
#
# Additional list of Zabbix host group names, defined on specific hosts in
# the Ansible inventory.
zabbix_agent__api_host_host_groups: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_combined_host_groups [[[
#
# Variable which combines all of the Zabbix host group lists together and is
# used in role tasks.
zabbix_agent__api_combined_host_groups: '{{ (zabbix_agent__api_host_groups
                                           + zabbix_agent__api_group_host_groups
                                           + zabbix_agent__api_host_host_groups)
                                           | flatten | unique }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_link_templates [[[
#
# List of Zabbix template names linked to the host, defined on all hosts in
# the Ansible inventory. Templates which do not exist in Zabbix are silently
# skipped. This variable should not be modified directly, see the
# ``group``/``host`` variables below.
zabbix_agent__api_link_templates: [ 'Linux by Zabbix agent' ]

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_group_link_templates [[[
#
# Additional list of Zabbix template names, defined on hosts in a specific
# Ansible inventory group.
zabbix_agent__api_group_link_templates: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_host_link_templates [[[
#
# Additional list of Zabbix template names, defined on specific hosts in the
# Ansible inventory.
zabbix_agent__api_host_link_templates: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_combined_link_templates [[[
#
# Variable which combines all of the Zabbix template lists together,
# including templates auto-detected for services running on the host (see
# :envvar:`zabbix_agent__service_templates__combined_names`), and is used in
