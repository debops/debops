# Automatic service monitoring [[[
# --------------------------------

# The Zabbix Agent 2 daemon ships with a set of built-in plugins which can
# monitor common services (PostgreSQL, Docker, Redis, ...) directly, without
# any external scripts. Zabbix Server also ships official templates for
# these plugins. This role can detect well-known DebOps service roles
# applied to the current host (based on Ansible inventory group membership)
# and automatically link the matching template and configure the plugin,
# instead of requiring each project to duplicate this glue code.
#
# .. envvar:: zabbix_agent__default_service_templates [[[
#
# List of known service integrations autodetected by the role. Each item is
# a dict which can contain:
#
# ``name``
#   Unique identifier of the service integration, used to enable, disable or
#   override it via :envvar:`zabbix_agent__service_templates`,
#   :envvar:`zabbix_agent__group_service_templates` and
#   :envvar:`zabbix_agent__host_service_templates`.
#
# ``enabled``
#   Boolean which decides if the integration should be active on the current
#   host. By default based on Ansible inventory group membership.
#
# ``templates``
#   List of Zabbix template names to link to the host when the integration
#   is enabled.
#
# ``plugin_name``
#   Optional filename (without a path) of the Zabbix Agent 2 plugin
#   configuration drop-in file, relative to
#   ``/etc/zabbix/zabbix_agent2.d/plugins.d/``.
#
# ``plugin_content``
#   Optional contents of the plugin configuration drop-in file.
#
# ``additional_groups``
#   Optional list of extra UNIX groups the Zabbix Agent account should be
#   added to (for example ``docker``), required for the plugin to access
#   the monitored service.
#
# This variable should not be modified directly; disable or override
# a specific integration using the ``group``/``host`` variables below
# instead, for example::
#
#     zabbix_agent__host_service_templates:
#       - name: 'nginx'
#         state: 'absent'
zabbix_agent__default_service_templates:

  - name: 'postgresql'
    enabled: '{{ ("debops_service_postgresql_server" in group_names)
                 or (ansible_local.postgresql_server.installed | d() | bool) }}'
    templates: [ 'PostgreSQL by Zabbix agent 2' ]
    plugin_name: 'ansible-postgresql.conf'
    plugin_content: |
      Plugins.PostgreSQL.Uri=tcp://127.0.0.1:{{ zabbix_agent__service_templates__postgresql_port }}
      Plugins.PostgreSQL.User={{ zabbix_agent__service_templates__postgresql_user }}
      Plugins.PostgreSQL.Password={{ zabbix_agent__service_templates__postgresql_password }}

  - name: 'nginx'
    enabled: '{{ "debops_service_nginx" in group_names }}'
    templates: [ 'Nginx by Zabbix agent 2' ]
    plugin_name: 'ansible-nginx.conf'
    plugin_content: |
      Plugins.Nginx.Uri={{ zabbix_agent__service_templates__nginx_status_url }}

  - name: 'docker'
    enabled: '{{ ("debops_service_docker_server" in group_names)
                 or ("debops_service_docker_compose_service" in group_names) }}'
    templates: [ 'Docker by Zabbix agent 2' ]
    plugin_name: 'ansible-docker.conf'
    plugin_content: |
      Plugins.Docker.Endpoint=unix:///var/run/docker.sock
    additional_groups: [ 'docker' ]

  - name: 'redis'
    enabled: '{{ "debops_service_redis_server" in group_names }}'
    templates: [ 'Redis by Zabbix agent 2' ]
    plugin_name: 'ansible-redis.conf'
    plugin_content: |
      Plugins.Redis.Uri=tcp://127.0.0.1:{{ zabbix_agent__service_templates__redis_port }}

  - name: 'postfix'
    enabled: '{{ "debops_service_postfix" in group_names }}'
    templates: [ 'Postfix by Zabbix agent' ]

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates__postgresql_port [[[
#
# TCP port used by the PostgreSQL monitoring plugin.
zabbix_agent__service_templates__postgresql_port: '5432'

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates__postgresql_user [[[
#
# Name of the read-only PostgreSQL role used by the monitoring plugin. This
# role is not created automatically; it should be configured using the
# :ref:`debops.postgresql` role's dependent variables on the database server
# host, for example via ``postgresql__dependent_roles``.
zabbix_agent__service_templates__postgresql_user: 'zabbix_monitor'

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates__postgresql_password [[[
#
# Password of the PostgreSQL monitoring role, read from the DebOps
# ``secret/`` directory. The same lookup path should be used when defining
# the role's password on the database server.
zabbix_agent__service_templates__postgresql_password: '{{ lookup("password", secret
                                                            + "/zabbix/postgresql/"
                                                            + inventory_hostname
                                                            + "/" + zabbix_agent__service_templates__postgresql_user
                                                            + ".password length=32") }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates__nginx_status_url [[[
#
# URL of the nginx ``stub_status`` endpoint used by the Nginx monitoring
# plugin. The corresponding ``location`` block has to be configured
# separately in the relevant nginx server/vhost (restricted to
# ``127.0.0.1``), since this role has no way of knowing which vhost should
# expose it.
zabbix_agent__service_templates__nginx_status_url: 'http://127.0.0.1/basic_status'

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates__redis_port [[[
#
# TCP port used by the Redis monitoring plugin.
zabbix_agent__service_templates__redis_port: '6379'

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates [[[
#
# List of service integration overrides, defined on all hosts in the
# Ansible inventory. Each item should at least contain a ``name`` matching
# an entry in :envvar:`zabbix_agent__default_service_templates` (to
# enable/disable/reconfigure it) or a new ``name`` with its own
# ``templates``/``plugin_name``/``plugin_content`` (to add a custom
# integration). This variable should not be modified directly, see the
# ``group``/``host`` variables below.
zabbix_agent__service_templates: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__group_service_templates [[[
#
# Additional list of service integration overrides, defined on hosts in
# a specific Ansible inventory group.
zabbix_agent__group_service_templates: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__host_service_templates [[[
#
# Additional list of service integration overrides, defined on specific
# hosts in the Ansible inventory.
zabbix_agent__host_service_templates: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates__combined [[[
#
# Variable which combines the default, autodetected service integrations
# with the ``group``/``host`` overrides (matched by ``name``), filters out
# the disabled ones, and is used in role tasks. Later entries with the same
# ``name`` override earlier ones (via
# :command:`debops.debops.parse_kv_config`), and ``state: 'absent'`` removes
# a given integration completely.
zabbix_agent__service_templates__combined: '{{
    ((zabbix_agent__default_service_templates | selectattr("enabled") | list)
     + zabbix_agent__service_templates
     + zabbix_agent__group_service_templates
     + zabbix_agent__host_service_templates)
    | debops.debops.parse_kv_config
    | selectattr("state", "equalto", "present")
    | list }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates__combined_names [[[
#
# Flat, deduplicated list of Zabbix template names linked based on detected
# service integrations. Included automatically in
# :envvar:`zabbix_agent__api_combined_link_templates`.
zabbix_agent__service_templates__combined_names: '{{ zabbix_agent__service_templates__combined
                                                   | selectattr("templates", "defined")
                                                   | map(attribute="templates")
                                                   | list | flatten | unique }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates__combined_plugins [[[
#
# List of Zabbix Agent 2 plugin configuration drop-in files to render, based
# on detected service integrations.
zabbix_agent__service_templates__combined_plugins: '{{ zabbix_agent__service_templates__combined
                                                     | selectattr("plugin_name", "defined")
                                                     | selectattr("plugin_content", "defined")
                                                     | list }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__service_templates__combined_additional_groups [[[
#
# Flat, deduplicated list of extra UNIX groups required by the detected
