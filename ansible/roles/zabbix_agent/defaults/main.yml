zabbix_agent__api_combined_link_templates: '{{ (zabbix_agent__api_link_templates
                                              + zabbix_agent__api_group_link_templates
                                              + zabbix_agent__api_host_link_templates
                                              + (["LXC container"] if zabbix_agent__cgroup_metrics__enabled else [])
                                              + zabbix_agent__service_templates__combined_names)
                                              | flatten | unique }}'

