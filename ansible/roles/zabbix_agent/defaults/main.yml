                                  + zabbix_agent__cgroup_metrics__scripts }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__user_parameters_conf_path [[[
#
# Absolute path to the configuration file which holds the UserParameters
# defined by this role.
zabbix_agent__user_parameters_conf_path: '{{ "/etc/zabbix/zabbix_agentd.conf.d/ansible-userparams.conf"
                                             if (zabbix_agent__flavor == "C")
                                             else "/etc/zabbix/zabbix_agent2.d/ansible-userparams.conf" }}'

