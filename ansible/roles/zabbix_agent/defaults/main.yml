# Agent flavor and state [[[
# --------------------------

# .. envvar:: zabbix_agent__flavor [[[
#
# Select the "flavor" of the Zabbix Agent to use. This option determines which
# APT package will be used by the role to manage Zabbix Agent on a given host.
# The role does not support changing flavor on existing installations
# (uninstall the current Zabbix Agent before installing a different one).
# Currently supported flavors: ``C``, ``Go``.
# See https://www.zabbix.com/documentation/current/en/manual/appendix/agent_comparison
# for details about differences between Zabbix Agent flavors.
zabbix_agent__flavor: 'C'

                                                                   # ]]]
# .. envvar:: zabbix_agent__deploy_state [[[
#
# Define the desired state of the Zabbix Agent on a given host. If ``present``,
# the role will install and configure the Zabbix Agent of a given flavor. If
# ``absent``, the role will uninstall and purge Zabbix Agent and its
# configuration from the host. This parameter can be used to clean up the
# configuration on a host before changing the Zabbix Agent flavor to
# a different one.
zabbix_agent__deploy_state: 'present'
                                                                   # ]]]
                                                                   # ]]]
# Packages and installation [[[
# -----------------------------

# .. envvar:: zabbix_agent__base_packages [[[
#
# List of APT packages to install for :command:`zabbix_agent` support.
zabbix_agent__base_packages: '{{ ["zabbix-agent"]
                                 if (zabbix_agent__flavor == "C")
                                 else ["zabbix-agent2"] }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__packages [[[
#
# List of additional APT packages to install during
# :command:`zabbix_agent` configuration.
zabbix_agent__packages: []
                                                                   # ]]]
                                                                   # ]]]
# Network configuration [[[
# -------------------------

# .. envvar:: zabbix_agent__allow [[[
#
# List of IP addresses or CIDR subnets which are allowed to connect to the
# Zabbix agent over the network, on all hosts in the Ansible inventory.
# If not specified, all hosts can connect to Zabbix agent.
zabbix_agent__allow: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__group_allow [[[
#
# List of IP addresses or CIDR subnets which are allowed to connect to the
# Zabbix agent over the network, on hosts in a specific Ansible inventory
# group. If not specified, all hosts can connect to Zabbix agent.
zabbix_agent__group_allow: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__host_allow [[[
#
# List of IP addresses or CIDR subnets which are allowed to connect to the
# Zabbix agent over the network, on specific hosts in the Ansible
# inventory. If not specified, all hosts can connect to Zabbix agent.
zabbix_agent__host_allow: []
                                                                   # ]]]
                                                                   # ]]]
# UNIX environment [[[
# --------------------

# .. envvar:: zabbix_agent__user [[[
#
# Name of the UNIX account used to run Zabbix agent.
zabbix_agent__user: 'zabbix'

                                                                   # ]]]
# .. envvar:: zabbix_agent__group [[[
#
# Name of the UNIX group used by Zabbix agent.
zabbix_agent__group: 'zabbix'

                                                                   # ]]]
# .. envvar:: zabbix_agent__additional_groups [[[
#
# List of additional UNIX groups which should include the Zabbix agent
# account, defined by the role itself. See
# :envvar:`zabbix_agent__combined_additional_groups` for the variable used in
# role tasks.
zabbix_agent__additional_groups:

  # Integration with the 'debops.proc_hidepid' role to provide system-wide
  # access to the /proc filesystem.
  - '{{ (ansible_local.proc_hidepid.group | d("procadmins"))
        if (ansible_local.proc_hidepid.enabled | d()) | bool
        else [] }}'

  # Integration with the 'debops.pki' role. In 'cert' TLS mode the Zabbix
  # Agent needs read access to the private key stored in a PKI realm, owned
  # by the group configured in 'zabbix_agent__tls_pki_group' (usually
  # 'ssl-cert'). Without this, 'zabbix-agent2' fails to start with
  # "failed to initialize encryption" / permission denied on the key file.
  - '{{ zabbix_agent__tls_pki_group
        if (zabbix_agent__tls_mode == "cert")
        else [] }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__group_additional_groups [[[
#
# List of additional UNIX groups which should include the Zabbix agent
# account, defined on hosts in a specific Ansible inventory group.
zabbix_agent__group_additional_groups: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__host_additional_groups [[[
#
# List of additional UNIX groups which should include the Zabbix agent
# account, defined on specific hosts in the Ansible inventory.
zabbix_agent__host_additional_groups: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__combined_additional_groups [[[
#
# Variable which combines the lists of additional UNIX groups and is used in
# role tasks. Hosts and groups only need to specify additional entries,
# instead of repeating the role defaults.
zabbix_agent__combined_additional_groups: '{{ (zabbix_agent__additional_groups
                                             + zabbix_agent__group_additional_groups
                                             + zabbix_agent__host_additional_groups
                                             + zabbix_agent__service_templates__combined_additional_groups)
                                             | flatten | unique }}'
                                                                   # ]]]
# .. envvar:: zabbix_agent__conf_file_path [[[
#
# The absolute path to the main Zabbix Agent configuration file.
zabbix_agent__conf_file_path: '{{ "/etc/zabbix/zabbix_agentd.conf"
                                  if (zabbix_agent__flavor == "C")
                                  else "/etc/zabbix/zabbix_agent2.conf" }}'
                                                                   # ]]]
                                                                   # ]]]
# Zabbix agent configuration [[[
# ------------------------------

# These variables define the contents of the main Zabbix Agent configuration
# file.

# .. envvar:: zabbix_agent__tls_mode [[[
#
# Selects how the Zabbix Agent encrypts and authenticates its connections to
# and from the Zabbix Server or Proxy. This defines the ``TLSConnect`` and
# ``TLSAccept`` configuration options, and the related certificate/PSK
# parameters. Available choices:
#
# - ``psk``: use a pre-shared key generated and stored using the DebOps
#   :command:`secret` mechanism. This is the default, kept for backwards
#   compatibility with existing installations.
#
# - ``cert``: use a host certificate managed by the :ref:`debops.pki` Ansible
#   role. The role will look up the certificate, private key and CA bundle
#   paths in the PKI realm selected by
#   :envvar:`zabbix_agent__tls_pki_realm`, and will automatically add the
#   :envvar:`zabbix_agent__user` UNIX account to the UNIX group that owns the
#   PKI realm private files (see :envvar:`zabbix_agent__tls_pki_group`), so
#   that the agent daemon can read its private key at startup. Without this,
#   ``zabbix-agent2`` fails to start with a permission error while trying to
#   initialize encryption.
#
# - ``unencrypted``: disable TLS support and use plain-text connections.
zabbix_agent__tls_mode: 'psk'

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_psk_identity [[[
#
# Unique, case sensitive string used to identify the pre-shared key. Used
# only when :envvar:`zabbix_agent__tls_mode` is ``psk``.
zabbix_agent__tls_psk_identity: '{{ lookup("password", secret
                                    + "/zabbix/identities/" + inventory_hostname
                                    + "/identity.key length=32 chars=ascii_letters,digits") }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_psk_secret [[[
#
# Case sensitive secret key stored in a file and used
# with the pre-shared key. Used only when :envvar:`zabbix_agent__tls_mode` is
# ``psk``.
zabbix_agent__tls_psk_secret: '{{ lookup("password", secret
                                  + "/zabbix/identities/" + inventory_hostname
                                  + "/secret.key length=64 chars=abcdef,digits") }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_pki_realm [[[
#
# Name of the PKI realm configured by the :ref:`debops.pki` Ansible role
# which will be used to look up the host certificate files when
# :envvar:`zabbix_agent__tls_mode` is ``cert``. By default the role will use
# the system-wide PKI realm detected via Ansible local facts.
zabbix_agent__tls_pki_realm: '{{ ansible_local.pki.realm
                                  if (ansible_local.pki.realm | d())
                                  else (pki_system_realm | d("domain")) }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_pki_path [[[
#
# Base path to the directory which holds the PKI realms, as configured by
# the :ref:`debops.pki` Ansible role.
zabbix_agent__tls_pki_path: '{{ ansible_local.pki.base_path
                                 if (ansible_local.pki.base_path | d())
                                 else ((pki_root | d("/etc/pki")) + "/realms") }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_pki_group [[[
#
# Name of the UNIX group which owns the private files of the PKI realm
# selected above (usually ``ssl-cert``). The Zabbix Agent UNIX account is
# added to this group automatically when :envvar:`zabbix_agent__tls_mode` is
# ``cert``, see :envvar:`zabbix_agent__additional_groups`.
zabbix_agent__tls_pki_group: '{{ pki_private_group | d("ssl-cert") }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_cert_file [[[
#
# Full path to the file with the host certificate or certificate chain, used
# when :envvar:`zabbix_agent__tls_mode` is ``cert``.
zabbix_agent__tls_cert_file: '{{ zabbix_agent__tls_pki_path + "/"
                                  + zabbix_agent__tls_pki_realm + "/"
                                  + (ansible_local.pki.crt | d("default.crt")) }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_key_file [[[
#
# Full path to the file with the host private key, used when
# :envvar:`zabbix_agent__tls_mode` is ``cert``.
zabbix_agent__tls_key_file: '{{ zabbix_agent__tls_pki_path + "/"
                                 + zabbix_agent__tls_pki_realm + "/"
                                 + (ansible_local.pki.key | d("default.key")) }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_ca_file [[[
#
# Full path to the file with the top-level CA certificate(s) used to verify
# the Zabbix Server/Proxy certificate, used when
# :envvar:`zabbix_agent__tls_mode` is ``cert``.
zabbix_agent__tls_ca_file: '{{ zabbix_agent__tls_pki_path + "/"
                                + zabbix_agent__tls_pki_realm + "/"
                                + (ansible_local.pki.ca | d("CA.crt")) }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_server_cert_subject [[[
#
# Expected TLS certificate subject of the Zabbix Server/Proxy, checked by the
# agent when :envvar:`zabbix_agent__tls_mode` is ``cert``. If empty, the
# check is skipped. Example: ``CN=zabbix.example.org``.
zabbix_agent__tls_server_cert_subject: ''

                                                                   # ]]]
# .. envvar:: zabbix_agent__tls_server_cert_issuer [[[
#
# Expected TLS certificate issuer of the Zabbix Server/Proxy, checked by the
# agent when :envvar:`zabbix_agent__tls_mode` is ``cert``. If empty, the
# check is skipped.
zabbix_agent__tls_server_cert_issuer: ''

                                                                   # ]]]
# .. envvar:: zabbix_agent__original_configuration [[[
#
# List of the default configuration options defined in the Debian package.
zabbix_agent__original_configuration:

  - name: 'PidFile'
    comment: |
      Name of PID file.
    value: '/var/run/zabbix/zabbix_agentd.pid'
    state: '{{ "present" if (zabbix_agent__flavor == "C") else "comment" }}'

  - name: 'LogType'
    comment: |
      Specifies where log messages are written to
        system  - syslog
        file    - file specified with LogFile parameter
        console - standard output
    value: 'file'
    state: 'comment'

  - name: 'LogFile'
    comment: |
      Log file name for LogType 'file' parameter.
      Mandatory: yes, if LogType is set to file, otherwise no
    value: '/var/log/zabbix-agent/zabbix_agentd.log'
    state: '{{ "present" if (zabbix_agent__flavor == "C") else "comment" }}'

  - name: 'LogFileSize'
    comment: |
      Maximum size of log file in MB.
      0 - disable automatic log rotation.
      Range: 0-1024
    value: 0
    state: 'present'

  - name: 'DebugLevel'
    comment: |
      Specifies debug level:
      0 - basic information about starting and stopping of Zabbix processes
      1 - critical information
      2 - error information
      3 - warnings
      4 - for debugging (produces lots of information)
      5 - extended debugging (produces even more information)
    value: 3
    state: 'comment'

  - name: 'SourceIP'
    comment: |
      Source IP address for outgoing connections.
    value: ''
    state: 'comment'

  - name: 'EnableRemoteCommands'
    comment: |
      Whether remote commands from Zabbix server are allowed.
      0 - not allowed
      1 - allowed
    value: "0"
    state: 'comment'

  - name: 'LogRemoteCommands'
    comment: |
      Enable logging of executed shell commands as warnings.
      0 - disabled
      1 - enabled
    value: "0"
    state: 'comment'

  - name: 'Server'
    comment: |
      List of comma delimited IP addresses, optionally in CIDR notation, or DNS names of Zabbix servers and Zabbix proxies.
      Incoming connections will be accepted only from the hosts listed here.
      If IPv6 support is enabled then '127.0.0.1', '::127.0.0.1', '::ffff:127.0.0.1' are treated equally
      and '::/0' will allow any IPv4 or IPv6 address.
      '0.0.0.0/0' can be used to allow any IPv4 address.
      Example: Server=127.0.0.1,192.168.1.0/24,::1,2001:db8::/32,zabbix.example.com
      Mandatory: yes, if StartAgents is not explicitly set to 0
    value: '127.0.0.1'
    state: 'present'

  - name: 'ListenPort'
    comment: |
      Agent will listen on this port for connections from the server.
      Range: 1024-32767
    value: 10050
    state: 'comment'

  - name: 'ListenIP'
    comment: |
      List of comma delimited IP addresses that the agent should listen on.
      First IP address is sent to Zabbix server if connecting to it to retrieve list of active checks.
    value: '0.0.0.0'
    state: 'comment'

  - name: 'StartAgents'
    comment: |
      Number of pre-forked instances of zabbix_agentd that process passive checks.
      If set to 0, disables passive checks and the agent will not listen on any TCP port.
      Range: 0-100
    value: 3
    state: 'comment'

  - name: 'ServerActive'
    comment: |
      List of comma delimited IP:port (or DNS name:port) pairs of Zabbix servers and Zabbix proxies for active checks.'
      If port is not specified, default port is used.
      IPv6 addresses must be enclosed in square brackets if port for that host is specified.
      If port is not specified, square brackets for IPv6 addresses are optional.
      If this parameter is not specified, active checks are disabled.
      Example: ServerActive=127.0.0.1:20051,zabbix.domain,[::1]:30051,::1,[12fc::1]
    value: '127.0.0.1'
    state: 'present'

  - name: 'Hostname'
    comment: |
      Unique, case sensitive hostname.
      Required for active checks and must match hostname as configured on the server.
      Value is acquired from HostnameItem if undefined.
    value: ''
    state: 'comment'

  - name: 'HostnameItem'
    comment: |
      Item used for generating Hostname if it is undefined. Ignored if Hostname is defined.
      Does not support UserParameters or aliases.
    value: 'system.hostname'
    state: 'comment'

  - name: 'HostMetadata'
    comment: |
      Optional parameter that defines host metadata.
      Host metadata is used at host auto-registration process.
      An agent will issue an error and not start if the value is over limit of 255 characters.
      If not defined, value will be acquired from HostMetadataItem.
      Range: 0-255 characters
    value: ''
    state: 'comment'

  - name: 'HostMetadataItem'
    comment: |
      Optional parameter that defines an item used for getting host metadata.
      Host metadata is used at host auto-registration process.
      During an auto-registration request an agent will log a warning message if
      the value returned by specified item is over limit of 255 characters.
      This option is only used when HostMetadata is not defined.
    value: ''
    state: 'comment'

  - name: 'RefreshActiveChecks'
    comment: |
      How often list of active checks is refreshed, in seconds.
      Range: 60-3600
    value: 120
    state: 'comment'

  - name: 'BufferSend'
    comment: |
      Do not keep data longer than N seconds in buffer.
      Range: 1-3600
    value: 5
    state: 'comment'

  - name: 'BufferSize'
    comment: |
      Maximum number of values in a memory buffer. The agent will send
      all collected data to Zabbix Server or Proxy if the buffer is full.
      Range: 2-65535
    value: 100
    state: 'comment'

  - name: 'MaxLinesPerSecond'
    comment: |
      Maximum number of new lines the agent will send per second to Zabbix Server
      or Proxy processing 'log' and 'logrt' active checks.
      The provided value will be overridden by the parameter 'maxlines',
      provided in 'log' or 'logrt' item keys.
      Range: 1-1000
    value: 20
    state: 'comment'

  - name: 'Alias'
    comment: |
      Sets an alias for an item key. It can be used to substitute long and complex item key with a smaller and simpler one.
      Multiple Alias parameters may be present. Multiple parameters with the same Alias key are not allowed.
      Different Alias keys may reference the same item key.
      For example, to retrieve the ID of user 'zabbix':
      Alias=zabbix.userid:vfs.file.regexp[/etc/passwd,^zabbix:.:([0-9]+),,,,\1]
      Now shorthand key zabbix.userid may be used to retrieve data.
      Aliases can be used in HostMetadataItem but not in HostnameItem parameters.
    value: ''
    state: 'comment'

  - name: 'Timeout'
    comment: |
      Spend no more than Timeout seconds on processing
      Range: 1-30
    value: 3
    state: 'comment'

  - name: 'AllowRoot'
    comment: |
      Allow the agent to run as 'root'. If disabled and the agent is started by 'root', the agent
      will try to switch to the user specified by the User configuration option instead.
      Has no effect if started under a regular user.
      0 - do not allow
      1 - allow
    value: 0
    state: 'comment'

  - name: 'User'
    comment: |
      Drop privileges to a specific, existing user on the system.
      Only has effect if run as 'root' and AllowRoot is disabled.
    value: 'zabbix'
    state: 'comment'

  - name: 'Include'
    comment: |
      You may include individual files or all files in a directory in the configuration file.
      Installing Zabbix will create include directory in /etc/zabbix, unless modified during the compile time.
    value: '{{ "/etc/zabbix/zabbix_agentd.conf.d/*.conf"
               if (zabbix_agent__flavor == "C")
               else "/etc/zabbix/zabbix_agent2.d/*.conf" }}'
    state: 'present'

  - name: 'UnsafeUserParameters'
    comment: |
      Allow all characters to be passed in arguments to user-defined parameters.
      The following characters are not allowed:
      \ ' " ` * ? [ ] { } ~ $ ! & ; ( ) < > | # @
      Additionally, newline characters are not allowed.
        0 - do not allow
        1 - allow
    value: 0
    state: 'comment'

  - name: 'UserParameter'
    comment: |
      User-defined parameter to monitor. There can be several user-defined parameters.
      Format: UserParameter=<key>,<shell command>
      See 'zabbix_agentd' directory for examples.
    value: ''
    state: 'comment'

  - name: 'LoadModulePath'
    comment: |
      Full path to location of agent modules.
      Default depends on compilation options.
      To see the default path run command "zabbix_agentd --help".
    value: '${libdir}/modules'
    state: 'comment'

  - name: 'LoadModule'
    comment: |
      Module to load at agent startup. Modules are used to extend functionality of the agent.
      Format: LoadModule=<module.so>
      The modules must be located in directory specified by LoadModulePath.
      It is allowed to include multiple LoadModule parameters.
    value: ''
    state: 'comment'

  - name: 'TLSConnect'
    comment: |
      How the agent should connect to server or proxy. Used for active checks.
      Only one value can be specified:
          unencrypted - connect without encryption
          psk         - connect using TLS and a pre-shared key
          cert        - connect using TLS and a certificate
      Mandatory: yes, if TLS certificate or PSK parameters are defined (even for 'unencrypted' connection)
    value: 'unencrypted'
    state: 'comment'

  - name: 'TLSAccept'
    comment: |
      What incoming connections to accept.
      Multiple values can be specified, separated by comma:
          unencrypted - accept connections without encryption
          psk         - accept connections secured with TLS and a pre-shared key
          cert        - accept connections secured with TLS and a certificate
      Mandatory: yes, if TLS certificate or PSK parameters are defined (even for 'unencrypted' connection)
    value: 'unencrypted'
    state: 'comment'

  - name: 'TLSCAFile'
    comment: |
      Full pathname of a file containing the top-level CA(s) certificates for
      peer certificate verification.
    value: ''
    state: 'comment'

  - name: 'TLSCRLFile'
    comment: |
      Full pathname of a file containing revoked certificates.
    value: ''
    state: 'comment'

  - name: 'TLSServerCertIssuer'
    comment: |
      Allowed server certificate issuer.
    value: ''
    state: 'comment'

  - name: 'TLSServerCertSubject'
    comment: |
      Allowed server certificate subject.
    value: ''
    state: 'comment'

  - name: 'TLSCertFile'
    comment: |
      Full pathname of a file containing the agent certificate or certificate chain.
    value: ''
    state: 'comment'

  - name: 'TLSKeyFile'
    comment: |
      Full pathname of a file containing the agent private key.
    value: ''
    state: 'comment'

  - name: 'TLSPSKIdentity'
    comment: |
      Unique, case sensitive string used to identify the pre-shared key.
    value: ''
    state: 'comment'

  - name: 'TLSPSKFile'
    comment: |
      Full pathname of a file containing the pre-shared key.
    value: ''
    state: 'comment'

  - name: 'IncludePlugins'
    option: 'Include'
    comment: 'Include configuration files for plugins'
    value: './zabbix_agent2.d/plugins.d/*.conf'
    state: '{{ "present" if zabbix_agent__flavor == "Go" else "absent" }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__default_configuration [[[
#
# List of the default configuration options defined by the role.
zabbix_agent__default_configuration:

  - name: 'User'
    value: '{{ zabbix_agent__user }}'
    state: '{{ "present" if zabbix_agent__flavor == "C" else "ignore" }}'

  - name: 'TLSConnect'
    value: '{{ zabbix_agent__tls_mode }}'
    state: '{{ "comment" if (zabbix_agent__tls_mode == "unencrypted") else "present" }}'

  - name: 'TLSAccept'
    value: '{{ zabbix_agent__tls_mode }}'
    state: '{{ "comment" if (zabbix_agent__tls_mode == "unencrypted") else "present" }}'

  - name: 'TLSPSKIdentity'
    value: '{{ zabbix_agent__tls_psk_identity | d() }}'
    state: '{{ "present" if (zabbix_agent__tls_mode == "psk") else "comment" }}'

  - name: 'TLSPSKFile'
    value: '/etc/zabbix/secret.key'
    state: '{{ "present" if (zabbix_agent__tls_mode == "psk") else "comment" }}'

  - name: 'TLSCAFile'
    value: '{{ zabbix_agent__tls_ca_file }}'
    state: '{{ "present" if (zabbix_agent__tls_mode == "cert") else "comment" }}'

  - name: 'TLSCertFile'
    value: '{{ zabbix_agent__tls_cert_file }}'
    state: '{{ "present" if (zabbix_agent__tls_mode == "cert") else "comment" }}'

  - name: 'TLSKeyFile'
    value: '{{ zabbix_agent__tls_key_file }}'
    state: '{{ "present" if (zabbix_agent__tls_mode == "cert") else "comment" }}'

  - name: 'TLSServerCertSubject'
    value: '{{ zabbix_agent__tls_server_cert_subject }}'
    state: '{{ "present" if (zabbix_agent__tls_mode == "cert" and zabbix_agent__tls_server_cert_subject | d()) else "comment" }}'

  - name: 'TLSServerCertIssuer'
    value: '{{ zabbix_agent__tls_server_cert_issuer }}'
    state: '{{ "present" if (zabbix_agent__tls_mode == "cert" and zabbix_agent__tls_server_cert_issuer | d()) else "comment" }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__configuration [[[
#
# List of zabbix_agent configuration options defined on all hosts in
# the Ansible inventory.
zabbix_agent__configuration: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__group_configuration [[[
#
# List of zabbix_agent configuration options defined on hosts in a specific Ansible
# inventory group.
zabbix_agent__group_configuration: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__host_configuration [[[
#
# List of zabbix_agent configuration options defined on specific hosts in the
# Ansible inventory.
zabbix_agent__host_configuration: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__combined_configuration [[[
#
# Variable which combines zabbix_agent configuration lists and is used in role
# tasks and templates.
zabbix_agent__combined_configuration: '{{ zabbix_agent__original_configuration
                                      + zabbix_agent__default_configuration
                                      + zabbix_agent__configuration
                                      + zabbix_agent__group_configuration
                                      + zabbix_agent__host_configuration }}'
                                                                   # ]]]
                                                                   # ]]]
