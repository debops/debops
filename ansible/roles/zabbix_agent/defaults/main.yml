zabbix_agent__api_macros: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_group_macros [[[
#
# Additional list of user macros, defined on hosts in a specific Ansible
# inventory group.
zabbix_agent__api_group_macros: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_host_macros [[[
#
# Additional list of user macros, defined on specific hosts in the Ansible
# inventory.
zabbix_agent__api_host_macros: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_combined_macros [[[
#
# Variable which combines all of the user macro lists together and is used
# in role tasks.
zabbix_agent__api_combined_macros: '{{ zabbix_agent__api_macros
                                     + zabbix_agent__api_group_macros
                                     + zabbix_agent__api_host_macros }}'

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_tags [[[
#
# List of tags configured on the host object, defined on all hosts in the
# Ansible inventory. Each list item should be a dict with ``tag`` and
# ``value`` keys. This variable should not be modified directly, see the
# ``group``/``host`` variables below.
zabbix_agent__api_tags: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_group_tags [[[
#
# Additional list of tags, defined on hosts in a specific Ansible inventory
# group.
zabbix_agent__api_group_tags: []

                                                                   # ]]]
# .. envvar:: zabbix_agent__api_host_tags [[[
#
# Additional list of tags, defined on specific hosts in the Ansible
