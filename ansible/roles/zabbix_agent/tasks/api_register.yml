# Register the current host as a Zabbix host object through the Zabbix
# JSON-RPC API. Read-only API calls are also executed in check mode, so that
# the host object parameters can be computed; API calls which modify Zabbix
# are skipped in check mode.

- name: Register the host in Zabbix through the API
  delegate_to: '{{ zabbix_agent__api_delegate_to }}'
  become: False
  no_log: '{{ debops__no_log | d(True) }}'
  module_defaults:
    ansible.builtin.uri:
      url: '{{ zabbix_agent__api_url }}'
      method: 'POST'
      headers:
        Authorization: 'Bearer {{ zabbix_agent__api_token }}'
        Content-Type: 'application/json-rpc'
      body_format: 'json'
      validate_certs: '{{ zabbix_agent__api_validate_certs }}'
  vars:

    # Host groups and templates are merged by name, macros by the 'macro'
    # key. Entries in the 'init' and 'ignore' states are skipped.
    zabbix_agent__tpl_api_host_groups: '{{ zabbix_agent__api_combined_host_groups
                                           | debops.debops.parse_kv_items }}'
    zabbix_agent__tpl_api_present_host_groups: '{{ zabbix_agent__tpl_api_host_groups
                                                   | selectattr("state", "equalto", "present")
                                                   | map(attribute="name") | list }}'
    zabbix_agent__tpl_api_absent_host_groups: '{{ zabbix_agent__tpl_api_host_groups
                                                  | selectattr("state", "equalto", "absent")
                                                  | map(attribute="name") | list }}'
    zabbix_agent__tpl_api_templates: '{{ zabbix_agent__api_combined_link_templates
                                         | debops.debops.parse_kv_items }}'
    zabbix_agent__tpl_api_present_templates: '{{ zabbix_agent__tpl_api_templates
                                                 | selectattr("state", "equalto", "present")
                                                 | map(attribute="name") | list }}'
    zabbix_agent__tpl_api_absent_templates: '{{ zabbix_agent__tpl_api_templates
                                                | selectattr("state", "equalto", "absent")
                                                | map(attribute="name") | list }}'
    zabbix_agent__tpl_api_macros: '{{ zabbix_agent__api_combined_macros
                                      | debops.debops.parse_kv_items(name="macro") }}'
    zabbix_agent__tpl_api_managed_macro_names: '{{ zabbix_agent__tpl_api_macros
                                                   | selectattr("state", "in", ["present", "absent"])
                                                   | map(attribute="macro") | list }}'
    zabbix_agent__tpl_api_present_macros: '{{ zabbix_agent__tpl_api_macros
                                              | selectattr("state", "equalto", "present")
                                              | map("dict2items")
                                              | map("selectattr", "key", "in", ["macro", "value", "type", "description"])
                                              | map("list") | map("items2dict") | list }}'

    # Tags are not merged, since Zabbix allows the same tag with different
    # values. An entry in the 'absent' state removes the matching tag and
    # value pair from the host object.
    zabbix_agent__tpl_api_tags: '{{ zabbix_agent__api_combined_tags
                                    | map("dict2items")
                                    | map("selectattr", "key", "in", ["tag", "value", "state"])
                                    | map("list") | map("items2dict") | list }}'
    zabbix_agent__tpl_api_absent_tags: '{{ zabbix_agent__tpl_api_tags
                                           | selectattr("state", "defined")
                                           | selectattr("state", "equalto", "absent")
                                           | map("dict2items")
                                           | map("rejectattr", "key", "equalto", "state")
                                           | map("list") | map("items2dict") | list }}'
    zabbix_agent__tpl_api_present_tags: '{{ zabbix_agent__tpl_api_tags
                                            | rejectattr("state", "defined")
                                            | list
                                            + (zabbix_agent__tpl_api_tags
                                               | selectattr("state", "defined")
                                               | selectattr("state", "equalto", "present")
                                               | map("dict2items")
                                               | map("rejectattr", "key", "equalto", "state")
                                               | map("list") | map("items2dict") | list) }}'
  block:

    - name: Look up existing Zabbix host groups
      ansible.builtin.uri:
        body:
          jsonrpc: '2.0'
          method: 'hostgroup.get'
          params:
            output: [ 'groupid', 'name' ]
            filter:
              name: '{{ zabbix_agent__tpl_api_present_host_groups
                        + zabbix_agent__tpl_api_absent_host_groups }}'
          id: 1
      register: zabbix_agent__register_api_host_groups
      check_mode: False
      failed_when: zabbix_agent__register_api_host_groups.status | d(0) != 200 or
                   zabbix_agent__register_api_host_groups.json.result is not defined

    # Multiple hosts in the same play can try to create the same host group
    # at the same time; Zabbix rejects all but the first request with an
    # "already exists" error, which is expected.
    - name: Create missing Zabbix host groups
      ansible.builtin.uri:
        body:
          jsonrpc: '2.0'
          method: 'hostgroup.create'
          params:
            name: '{{ item }}'
          id: 1
      loop: '{{ zabbix_agent__tpl_api_present_host_groups
                | difference(zabbix_agent__register_api_host_groups.json.result
                             | map(attribute="name") | list) }}'
      register: zabbix_agent__register_api_new_host_groups
      changed_when: zabbix_agent__register_api_new_host_groups.json.result is defined
      failed_when: (zabbix_agent__register_api_new_host_groups.status | d(0) != 200 or
                    zabbix_agent__register_api_new_host_groups.json.result is not defined) and
                   not (zabbix_agent__register_api_new_host_groups.json.error.data | d('')
                        is search('already exists'))

    - name: Refresh the list of Zabbix host groups
      ansible.builtin.uri:
        body:
          jsonrpc: '2.0'
          method: 'hostgroup.get'
          params:
            output: [ 'groupid', 'name' ]
            filter:
              name: '{{ zabbix_agent__tpl_api_present_host_groups
                        + zabbix_agent__tpl_api_absent_host_groups }}'
          id: 1
      register: zabbix_agent__register_api_host_groups_refreshed
      check_mode: False
      failed_when: zabbix_agent__register_api_host_groups_refreshed.status | d(0) != 200 or
                   zabbix_agent__register_api_host_groups_refreshed.json.result is not defined
      when: zabbix_agent__register_api_new_host_groups.results | d([])
            | selectattr('json', 'defined') | list | length > 0

    - name: Look up Zabbix templates
      ansible.builtin.uri:
        body:
          jsonrpc: '2.0'
          method: 'template.get'
          params:
            output: [ 'templateid', 'host' ]
            filter:
              host: '{{ zabbix_agent__tpl_api_present_templates
                        + zabbix_agent__tpl_api_absent_templates }}'
          id: 1
      register: zabbix_agent__register_api_templates
      check_mode: False
      failed_when: zabbix_agent__register_api_templates.status | d(0) != 200 or
                   zabbix_agent__register_api_templates.json.result is not defined

    - name: Warn about Zabbix templates which do not exist
      ansible.builtin.debug:
        msg: 'Templates not found in Zabbix, skipped: {{ zabbix_agent__tpl_api_missing_templates | join(", ") }}'
      vars:
        zabbix_agent__tpl_api_missing_templates: '{{ zabbix_agent__tpl_api_present_templates
                                                     | difference(zabbix_agent__register_api_templates.json.result
                                                                  | map(attribute="host") | list) }}'
      no_log: False
      when: zabbix_agent__tpl_api_missing_templates | length > 0

    - name: Look up existing Zabbix host object
      ansible.builtin.uri:
        body:
          jsonrpc: '2.0'
          method: 'host.get'
          params:
            output: [ 'hostid' ]
            filter:
              host: [ '{{ zabbix_agent__api_host_name }}' ]
            selectInterfaces: [ 'interfaceid', 'type', 'main', 'useip', 'ip', 'dns', 'port', 'details' ]
            selectMacros: [ 'hostmacroid', 'macro', 'value', 'type', 'description', 'automatic' ]
            selectTags: [ 'tag', 'value', 'automatic' ]
            selectHostGroups: [ 'groupid' ]
            selectParentTemplates: [ 'templateid' ]
          id: 1
      register: zabbix_agent__register_api_host
      check_mode: False
      failed_when: zabbix_agent__register_api_host.status | d(0) != 200 or
                   zabbix_agent__register_api_host.json.result is not defined

    - name: Save existing Zabbix host object
      ansible.builtin.set_fact:
        zabbix_agent__fact_api_host: '{{ zabbix_agent__register_api_host.json.result | d([]) | first | d({}) }}'

    - name: Save existing Zabbix Agent interface
      ansible.builtin.set_fact:
        zabbix_agent__fact_api_agent_interface: '{{ zabbix_agent__fact_api_host.interfaces | d([])
                                                    | selectattr("type", "in", [1, "1"])
                                                    | selectattr("main", "in", [1, "1"])
                                                    | list | first | d({}) }}'

    # The 'host.update' API call replaces interfaces, macros and tags of the
    # host object, therefore entries not managed by the role are sent back,
    # limited to writable fields. Macros and tags created automatically by
    # Zabbix are skipped. Secret macros have no 'value', Zabbix keeps their
    # value based on 'hostmacroid'.
    - name: Save Zabbix host entries not managed by the role
      ansible.builtin.set_fact:
        zabbix_agent__fact_api_other_interfaces: '{{ (zabbix_agent__tpl_api_other_interfaces
                                                      | rejectattr("type", "in", [2, "2"])
                                                      | map("dict2items")
                                                      | map("selectattr", "key", "in", zabbix_agent__tpl_api_interface_fields)
                                                      | map("list") | map("items2dict") | list)
                                                     + (zabbix_agent__tpl_api_other_interfaces
                                                        | selectattr("type", "in", [2, "2"])
                                                        | map("dict2items")
                                                        | map("selectattr", "key", "in", zabbix_agent__tpl_api_interface_fields + ["details"])
                                                        | map("list") | map("items2dict") | list) }}'
        zabbix_agent__fact_api_other_macros: '{{ zabbix_agent__fact_api_host.macros | d([])
                                                 | rejectattr("automatic", "in", [1, "1"])
                                                 | rejectattr("macro", "in", zabbix_agent__tpl_api_managed_macro_names)
                                                 | map("dict2items")
                                                 | map("selectattr", "key", "in", ["hostmacroid", "macro", "value", "type", "description"])
                                                 | map("list") | map("items2dict") | list }}'
        zabbix_agent__fact_api_other_tags: '{{ zabbix_agent__fact_api_host.tags | d([])
                                               | rejectattr("automatic", "in", [1, "1"])
                                               | map("dict2items")
                                               | map("selectattr", "key", "in", ["tag", "value"])
                                               | map("list") | map("items2dict")
                                               | reject("in", zabbix_agent__tpl_api_present_tags
                                                              + zabbix_agent__tpl_api_absent_tags) | list }}'
      vars:
        zabbix_agent__tpl_api_interface_fields: [ 'interfaceid', 'type', 'main', 'useip', 'ip', 'dns', 'port' ]
        zabbix_agent__tpl_api_other_interfaces: '{{ zabbix_agent__fact_api_host.interfaces | d([])
                                                    | rejectattr("interfaceid", "equalto",
                                                                 zabbix_agent__fact_api_agent_interface.interfaceid | d(""))
                                                    | list }}'

    # Host groups and templates are the ones managed by the role, followed by
    # the ones already assigned to the host object, except those in the
    # 'absent' state. Templates left out of the 'host.update' call are
    # unlinked from the host without clearing their items.
    - name: Build Zabbix host object parameters
      ansible.builtin.set_fact:
        zabbix_agent__fact_api_host_params: '{{ {"host": zabbix_agent__api_host_name,
          "name": zabbix_agent__api_visible_name,
          "status": zabbix_agent__api_status | int,
          "groups": (zabbix_agent__tpl_api_known_host_groups
                     | selectattr("name", "in", zabbix_agent__tpl_api_present_host_groups)
                     | map(attribute="groupid") | list
                     + (zabbix_agent__fact_api_host.hostgroups | d([]) | map(attribute="groupid")
                        | reject("in", zabbix_agent__tpl_api_known_host_groups
                                       | selectattr("name", "in", zabbix_agent__tpl_api_absent_host_groups)
                                       | map(attribute="groupid") | list) | list))
                    | unique | map("community.general.dict_kv", "groupid") | list,
          "templates": (zabbix_agent__register_api_templates.json.result
                        | selectattr("host", "in", zabbix_agent__tpl_api_present_templates)
                        | map(attribute="templateid") | list
                        + (zabbix_agent__fact_api_host.parentTemplates | d([]) | map(attribute="templateid")
                           | reject("in", zabbix_agent__register_api_templates.json.result
                                          | selectattr("host", "in", zabbix_agent__tpl_api_absent_templates)
                                          | map(attribute="templateid") | list) | list))
                       | unique | map("community.general.dict_kv", "templateid") | list,
          "macros": zabbix_agent__fact_api_other_macros + zabbix_agent__tpl_api_present_macros,
          "tags": zabbix_agent__fact_api_other_tags
                  + (zabbix_agent__tpl_api_present_tags | unique
                     | reject("in", zabbix_agent__tpl_api_absent_tags) | list),
          "interfaces": zabbix_agent__fact_api_other_interfaces + [zabbix_agent__tpl_api_agent_interface],
          "tls_connect": zabbix_agent__tpl_api_tls_map[zabbix_agent__tls_mode],
          "tls_accept": zabbix_agent__tpl_api_tls_map[zabbix_agent__tls_mode]}
          | combine({"tls_psk_identity": zabbix_agent__tls_psk_identity,
                     "tls_psk": zabbix_agent__tls_psk_secret}
                    if (zabbix_agent__tls_mode == "psk")
                    else ({"tls_psk_identity": "", "tls_psk": ""}
                          if (zabbix_agent__fact_api_host.hostid | d()) else {}))
          | combine({"tls_subject": zabbix_agent__api_tls_subject,
                     "tls_issuer": zabbix_agent__api_tls_issuer}
                    if (zabbix_agent__tls_mode == "cert") else {})
          | combine({"hostid": zabbix_agent__fact_api_host.hostid}
                    if (zabbix_agent__fact_api_host.hostid | d()) else {}) }}'
      vars:
        zabbix_agent__tpl_api_tls_map:
          'unencrypted': 1
          'psk': 2
          'cert': 4
        zabbix_agent__tpl_api_known_host_groups: '{{ zabbix_agent__register_api_host_groups_refreshed.json.result
                                                     | d(zabbix_agent__register_api_host_groups.json.result) }}'
        zabbix_agent__tpl_api_agent_interface: '{{ {"type": 1,
          "main": 1,
          "useip": zabbix_agent__api_interface_useip | int,
          "ip": zabbix_agent__api_interface_ip,
          "dns": zabbix_agent__api_interface_dns,
          "port": zabbix_agent__api_interface_port | string}
          | combine({"interfaceid": zabbix_agent__fact_api_agent_interface.interfaceid}
                    if (zabbix_agent__fact_api_agent_interface.interfaceid | d()) else {}) }}'

    - name: Create or update Zabbix host object
      ansible.builtin.uri:
        body:
          jsonrpc: '2.0'
          method: '{{ zabbix_agent__tpl_api_method }}'
          params: '{{ zabbix_agent__fact_api_host_params }}'
          id: 1
      vars:
        zabbix_agent__tpl_api_method: '{{ "host.update" if (zabbix_agent__fact_api_host.hostid | d()) else "host.create" }}'
      register: zabbix_agent__register_api_host_result
      changed_when: zabbix_agent__tpl_api_method == 'host.create'
      failed_when: zabbix_agent__register_api_host_result.status | d(0) != 200 or
                   zabbix_agent__register_api_host_result.json.result is not defined
