# Manage one exporter. Included in a loop with loop_var 'exporter'.

# The environment variables are written to a shell-like file, so each one
# needs a valid name and a single value. A dictionary or a list given as
# a value is not kept, or is split into elements, by the parse_kv_config
# filter. The configuration entries are merged into one dictionary.
- name: Validate exporter {{ exporter.name }}
  ansible.builtin.assert:
    that:
      - exporter.state in [ 'present', 'absent' ]
      - (exporter.state == 'absent')
        or (exporter.listen_address is defined)
        or (exporter.name in prometheus_exporter__known_ports)
      - (exporter.state == 'absent')
        or ((prometheus_exporter__var_environment
             | rejectattr('name', 'match', '[A-Za-z_][A-Za-z0-9_]*\\Z')
             | list | length) == 0)
      - (exporter.state == 'absent')
        or ((prometheus_exporter__var_environment
             | rejectattr('value', 'defined')
             | list | length) == 0)
      - (exporter.state == 'absent')
        or ((prometheus_exporter__var_environment
             | selectattr('value', 'defined')
             | map(attribute='value')
             | select('iterable') | reject('string')
             | list | length) == 0)
      - (exporter.state == 'absent')
        or ((prometheus_exporter__var_configuration
             | rejectattr('config', 'defined')
             | list | length) == 0)
      - (exporter.state == 'absent')
        or ((prometheus_exporter__var_configuration
             | map(attribute='config')
             | reject('mapping')
             | list | length) == 0)
    quiet: True
    fail_msg: >-
      Exporter '{{ exporter.name }}' in the 'present' state needs either
      'listen_address' or a 'name' found in prometheus_exporter__known_ports.
      Each entry of its 'environment' list needs a valid variable name
      (letters, digits and '_', not starting with a digit) and a string or
      number in 'value', and each entry of its 'configuration' list needs
      a dictionary in 'config'.
  vars:
    prometheus_exporter__var_environment: '{{ exporter.environment | d([])
                                              | rejectattr("state", "in", ["absent", "init", "ignore"])
                                              | list }}'
    prometheus_exporter__var_configuration: '{{ exporter.configuration | d([])
                                                | rejectattr("state", "in", ["absent", "init", "ignore"])
                                                | list }}'

- name: Resolve settings for exporter {{ exporter.name }}
  ansible.builtin.set_fact:
    prometheus_exporter__fact_service: "{{ exporter.service | d('prometheus-' ~ exporter.name ~ '-exporter') }}"
    prometheus_exporter__fact_package: "{{ exporter.package | d('prometheus-' ~ exporter.name ~ '-exporter') }}"
    prometheus_exporter__fact_bin: "{{ exporter.bin_path | d('/usr/bin/' ~ (exporter.service | d('prometheus-' ~ exporter.name ~ '-exporter'))) }}"
    prometheus_exporter__fact_listen: "{{ exporter.listen_address | d(prometheus_exporter__default_listen_host ~ ':' ~ (prometheus_exporter__known_ports[exporter.name] | d('') | string)) }}"
    prometheus_exporter__fact_config_path: "{{ exporter.config_path | d(prometheus_exporter__config_dir ~ '/' ~ exporter.name ~ '.yml') }}"
    prometheus_exporter__fact_secret: "{{ (prometheus_exporter__exporter_environment | length > 0) | bool }}"
    prometheus_exporter__fact_env_path: "{{ prometheus_exporter__config_dir ~ '/' ~ exporter.name ~ '.env' }}"

- name: Deploy exporter {{ exporter.name }}
  when: exporter.state == 'present'
  block:

    - name: Install APT package for exporter {{ exporter.name }}
      ansible.builtin.apt:
        name: '{{ [prometheus_exporter__fact_package] + (exporter.packages | d([])) }}'
        state: 'present'
        update_cache: True
        cache_valid_time: 3600
        # Do not start the exporter with the configuration of the package
        # before the drop-in is installed.
        policy_rc_d: 101

    - name: Deploy config file for exporter {{ exporter.name }}
      ansible.builtin.template:
        src: 'etc/prometheus/exporter-config.yml.j2'
        dest: '{{ prometheus_exporter__fact_config_path }}'
        owner: 'root'
        group: '{{ exporter.config_group | d("root") }}'
        mode: '{{ exporter.config_mode | d("0644") }}'
      no_log: '{{ prometheus_exporter__exporter_config_no_log }}'
      register: prometheus_exporter__register_config
      when: prometheus_exporter__exporter_configuration | length > 0

    - name: Deploy extra config files for exporter {{ exporter.name }}
      ansible.builtin.copy:
        content: '{{ item.content | d(omit) }}'
        src: '{{ item.src | d(omit) }}'
        dest: '{{ item.path }}'
        owner: 'root'
        group: '{{ item.group | d(exporter.config_group | d("root")) }}'
        mode: '{{ item.mode | d(exporter.config_mode | d("0644")) }}'
      loop: '{{ exporter.config_files | d([]) }}'
      loop_control:
        label: '{{ item.path }}'
      no_log: '{{ prometheus_exporter__exporter_config_no_log }}'
      register: prometheus_exporter__register_configfiles

    # systemd reads EnvironmentFile= before it drops privileges, so the
    # file stays readable by root only. Environment= values would be
    # visible to every local user through the D-Bus interface.
    - name: Deploy environment file for exporter {{ exporter.name }}
      ansible.builtin.template:
        src: 'etc/prometheus/exporter.env.j2'
        dest: '{{ prometheus_exporter__fact_env_path }}'
        owner: 'root'
        group: 'root'
        mode: '0600'
      no_log: '{{ debops__no_log | d(True) }}'
      register: prometheus_exporter__register_env
      when: prometheus_exporter__fact_secret | bool

    - name: Remove unused environment file for exporter {{ exporter.name }}
      ansible.builtin.file:
        path: '{{ prometheus_exporter__fact_env_path }}'
        state: 'absent'
      when: not (prometheus_exporter__fact_secret | bool)

    - name: Ensure systemd drop-in directory for exporter {{ exporter.name }}
      ansible.builtin.file:
        path: '{{ prometheus_exporter__dropin_dir }}/{{ prometheus_exporter__fact_service }}.service.d'
        state: 'directory'
        owner: 'root'
        group: 'root'
        mode: '0755'

    - name: Deploy systemd drop-in for exporter {{ exporter.name }}
      ansible.builtin.template:
        src: 'etc/systemd/system/exporter-override.conf.j2'
        dest: '{{ prometheus_exporter__dropin_dir }}/{{ prometheus_exporter__fact_service }}.service.d/override.conf'
        owner: 'root'
        group: 'root'
        mode: '0644'
      register: prometheus_exporter__register_dropin

    - name: Enable and start exporter {{ exporter.name }}
      ansible.builtin.systemd:
        name: '{{ prometheus_exporter__fact_service }}'
        enabled: True
        state: 'started'
        daemon_reload: True

    - name: Restart exporter on configuration change {{ exporter.name }}
      ansible.builtin.systemd:  # noqa no-handler
        name: '{{ prometheus_exporter__fact_service }}'
        state: 'restarted'
      when: (prometheus_exporter__register_config is changed) or
            (prometheus_exporter__register_configfiles is changed) or
            (prometheus_exporter__register_env is changed) or
            (prometheus_exporter__register_dropin is changed)

- name: Remove exporter {{ exporter.name }}
  when: exporter.state == 'absent'
  block:

    - name: Stop and disable exporter {{ exporter.name }}
      ansible.builtin.systemd:
        name: '{{ prometheus_exporter__fact_service }}'
        enabled: False
        state: 'stopped'
      register: prometheus_exporter__register_stop
      failed_when:
        - prometheus_exporter__register_stop is failed
        - "'Could not find the requested service' not in (prometheus_exporter__register_stop.msg | d(''))"
        - (prometheus_exporter__register_stop.status.LoadState | d('')) != 'not-found'

    - name: Remove drop-in for exporter {{ exporter.name }}
      ansible.builtin.file:
        path: '{{ prometheus_exporter__dropin_dir }}/{{ prometheus_exporter__fact_service }}.service.d/override.conf'
        state: 'absent'
      register: prometheus_exporter__register_absent_dropin

    - name: Remove environment file for exporter {{ exporter.name }}
      ansible.builtin.file:
        path: '{{ prometheus_exporter__fact_env_path }}'
        state: 'absent'

    - name: Remove config file for exporter {{ exporter.name }}
      ansible.builtin.file:
        path: '{{ prometheus_exporter__fact_config_path }}'
        state: 'absent'
      no_log: '{{ prometheus_exporter__exporter_config_no_log }}'
      when: prometheus_exporter__exporter_configuration | length > 0

    - name: Remove extra config files for exporter {{ exporter.name }}
      ansible.builtin.file:
        path: '{{ item.path }}'
        state: 'absent'
      loop: '{{ exporter.config_files | d([]) }}'
      loop_control:
        label: '{{ item.path }}'
      no_log: '{{ prometheus_exporter__exporter_config_no_log }}'

    - name: Reload systemd after removing drop-in {{ exporter.name }}
      ansible.builtin.systemd:  # noqa no-handler
        daemon_reload: True
      when: prometheus_exporter__register_absent_dropin is changed

    - name: Purge APT package for exporter {{ exporter.name }}
      ansible.builtin.apt:
        name: '{{ prometheus_exporter__fact_package }}'
        state: 'absent'
        purge: True
      when: prometheus_exporter__purge_on_absent | bool
